{% extends 'layouts/box.html' %}

{% block content %}
    <h1>Delete Chatroom</h1>
    <p>Are you sure you want to delete the "{{ chat_group.group_name }} chatroom"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="button button-red">Yes, Delete</button>
        <a class="button button-gray ml-1" href="{{ request.META.HTTP_REFERER }}">Cancel</a>
    </form>
{% endblock %}

upstream app_upstream {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Allow large uploads (e.g. backup restore). Match the bare-metal server.
    client_max_body_size 5g;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
    }

    location /ws/ {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep idle WebSocket connections alive (avoid premature disconnects)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts for slow/large operations (backup upload/restore)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Stream uploads straight to the backend instead of buffering the whole body
        proxy_request_buffering off;
    }
}

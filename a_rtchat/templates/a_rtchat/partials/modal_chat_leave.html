<div x-data="{ modal_open: false }" class="shrink-0">
    <a href="#" class="rounded-lg px-2 py-1 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 dark:text-slate-300 dark:hover:bg-white/10 dark:hover:text-white" @click.prevent="modal_open = true">Leave chat</a>

    <template x-teleport="body">
        <div x-show="modal_open" x-cloak @keydown.escape.window="modal_open = false" class="fixed inset-0 z-[200]">
            <div class="absolute inset-0 bg-black/50" @click="modal_open = false"></div>
            <div class="relative flex min-h-full items-center justify-center p-6">
                <div @click.away="modal_open = false" class="w-full max-w-md rounded-2xl bg-white/90 p-6 text-left shadow-xl ring-1 ring-black/10 backdrop-blur-xl dark:bg-slate-900/90 dark:ring-white/10">
                    <h1 class="mb-4 text-xl font-bold text-gray-900 dark:text-slate-100">Leave this chat?</h1>
                    <form method="POST" action="{% url 'chatroom-leave' chat_group.group_name %}">
                        {% csrf_token %}
                        <button type="submit" class="button button-red mt-4">Yes, I want to leave</button>
                        <button type="button" class="button button-gray ml-1 cursor-pointer" @click="modal_open = false">Cancel</button>
                    </form>
                </div>
            </div>
        </div>
    </template>
</div>

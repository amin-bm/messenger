  <script>
    (function () {
      const root = document.documentElement;
      const stored = (localStorage.getItem('theme') || '').toLowerCase();
      const prefersDark =
        typeof window !== 'undefined' &&
        window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initial = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';

      function syncLabel(theme) {
        const el = document.getElementById('theme-toggle-label');
        if (!el) return;
        el.textContent = theme === 'dark' ? 'حالت روشن' : 'حالت تیره';
      }

      function apply(theme) {
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        syncLabel(theme);
        try {
          window.dispatchEvent(new CustomEvent('themechange', { detail: { theme } }));
        } catch (e) {
          window.dispatchEvent(new Event('themechange'));
        }
      }

      window.setTheme = function (theme) {
        const next = theme === 'dark' ? 'dark' : 'light';
        localStorage.setItem('theme', next);
        apply(next);
      };

      window.toggleTheme = function () {
        const cur = (root.dataset.theme || 'light') === 'dark' ? 'dark' : 'light';
        window.setTheme(cur === 'dark' ? 'light' : 'dark');
      };

      apply(initial);
      document.addEventListener('DOMContentLoaded', () => syncLabel(root.dataset.theme || initial));
    })();
  </script>

  <script src="{% static 'vendor/alpine.min.js' %}?v={{ APP_VERSION|urlencode }}" defer></script>

<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' data-authenticated="{% if user.is_authenticated %}1{% else %}0{% endif %}" class="{% block class %}{% endblock %}">

  {% include 'includes/messages.html' %}

  {% block layout %}{% endblock %}

  <div id="sidebar_chat_actions_menu" class="fixed hidden z-[9998]">
    <div class="min-w-[170px] overflow-hidden rounded-xl bg-white shadow-xl ring-1 ring-black/10">
      <button type="button" data-action="pin" class="w-full px-4 py-3 text-right text-sm text-gray-800 hover:bg-gray-50 active:bg-gray-100">پین</button>
      <button type="button" data-action="mute" class="w-full px-4 py-3 text-right text-sm text-gray-800 hover:bg-gray-50 active:bg-gray-100">بی‌صدا</button>
    </div>
  </div>

  <script>
    // ---------- Tabs ----------
    function setSidebarTab(tab) {
      localStorage.setItem('sidebarTab', tab);

      const chatsPanel = document.getElementById('tab-chats-panel');
      const contactsPanel = document.getElementById('tab-contacts-panel');
      const tabs = document.querySelectorAll('.sidebar-tab');

      if (!chatsPanel || !contactsPanel || !tabs.length) return;

      if (tab === 'contacts') {
        chatsPanel.classList.add('hidden');
        contactsPanel.classList.remove('hidden');
      } else {
        contactsPanel.classList.add('hidden');
        chatsPanel.classList.remove('hidden');
      }

      tabs.forEach(btn => {
        const isActive = btn.dataset.tab === tab;
        btn.classList.toggle('bg-white', isActive);
        btn.classList.toggle('text-gray-900', isActive);
        btn.classList.toggle('shadow', isActive);
        btn.classList.toggle('text-gray-600', !isActive);
      });

      applySidebarSearch();
    }

    function bindSidebarTabs() {
      if (document.body.dataset.tabsBound === "1") return;
      document.body.dataset.tabsBound = "1";

      document.body.addEventListener('click', (e) => {
        const btn = e.target.closest('.sidebar-tab');
        if (!btn) return;
        setSidebarTab(btn.dataset.tab || 'chats');
      });
    }

    // ---------- Active highlight ----------
    function highlightActiveChat() {
      const path = window.location.pathname;
      document.querySelectorAll('#chats-list a.chat-item').forEach(a => {
        const url = a.getAttribute('data-chat-url');
        if (url && path === url) a.classList.add('bg-gray-200');
        else a.classList.remove('bg-gray-200');
      });
    }

    // ---------- Hover actions (Pin/Mute) with delegation ----------
    function bindSidebarHoverActions() {
      const list = document.getElementById('chats-list');
      if (!list) return;

      const supportsHover = Boolean(
        window.matchMedia &&
          (window.matchMedia('(hover: hover)').matches || window.matchMedia('(any-hover: hover)').matches)
      );
      if (!supportsHover) return;

      if (list.dataset.hoverBound === "1") return;
      list.dataset.hoverBound = "1";

      function showActions(li) {
        const actions = li ? li.querySelector('.group-actions') : null;
        if (actions) {
          actions.classList.remove('hidden');
          actions.style.display = 'flex';
        }
        const ellipsis = li ? li.querySelector('.chat-actions-ellipsis') : null;
        if (ellipsis) ellipsis.style.display = 'none';
      }

      function hideActions(li) {
        const actions = li ? li.querySelector('.group-actions') : null;
        if (actions) {
          actions.style.display = 'none';
          actions.classList.add('hidden');
        }
        const ellipsis = li ? li.querySelector('.chat-actions-ellipsis') : null;
        if (ellipsis) ellipsis.style.display = '';
      }

      list.addEventListener('mouseover', (e) => {
        const li = e.target.closest('li.chat-row');
        if (!li || !list.contains(li)) return;
        showActions(li);
      });

      list.addEventListener('mouseout', (e) => {
        const li = e.target.closest('li.chat-row');
        if (!li || !list.contains(li)) return;
        const related = e.relatedTarget;
        if (related && li.contains(related)) return;
        hideActions(li);
      });
    }

    function bindSidebarPinMuteOptimisticUI() {
      if (document.body.dataset.pinMuteBound === "1") return;
      document.body.dataset.pinMuteBound = "1";

      document.body.addEventListener('htmx:afterRequest', (e) => {
        const detail = e.detail || {};
        if (!detail.successful) return;

        const elt = detail.elt;
        if (!elt) return;

        const btn = elt.closest('button[hx-post]');
        if (!btn) return;

        const url = (btn.getAttribute('hx-post') || '').toString();
        const isPin = url.includes('/chat/pin/');
        const isMute = url.includes('/chat/mute/');
        if (!isPin && !isMute) return;

        const li = btn.closest('li.chat-row');
        const a = li ? li.querySelector('a.chat-item') : null;
        if (!li || !a) return;

        const key = isPin ? 'data-chat-pinned' : 'data-chat-muted';
        const current = a.getAttribute(key) === '1';
        const next = !current;
        a.setAttribute(key, next ? '1' : '0');

        const indicator = li.querySelector(isPin ? '[data-indicator="pinned"]' : '[data-indicator="muted"]');
        if (indicator) indicator.classList.toggle('hidden', !next);
      });
    }

    function bindSidebarChatActionsMenu() {
      const list = document.getElementById('chats-list');
      const menu = document.getElementById('sidebar_chat_actions_menu');
      if (!list || !menu) return;

      const isTouchPointer =
        (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
        (typeof navigator !== 'undefined' && (navigator.maxTouchPoints || 0) > 0);
      if (!isTouchPointer) return;

      if (list.dataset.actionsBound === "1") return;
      list.dataset.actionsBound = "1";

      const btnPin = menu.querySelector('[data-action="pin"]');
      const btnMute = menu.querySelector('[data-action="mute"]');
      let currentItem = null;

      function closeMenu() {
        menu.classList.add('hidden');
        menu.style.left = '';
        menu.style.top = '';
        currentItem = null;
      }

      function positionMenuNear(rect) {
        const vw = window.innerWidth || 0;
        const vh = window.innerHeight || 0;
        const margin = 8;

        const mw = menu.offsetWidth || 0;
        const mh = menu.offsetHeight || 0;

        let left = rect.right - mw;
        let top = rect.bottom + 8;

        if (left + mw + margin > vw) left = vw - mw - margin;
        if (left < margin) left = margin;
        if (top + mh + margin > vh) top = rect.top - mh - 8;
        if (top < margin) top = margin;

        menu.style.left = `${left}px`;
        menu.style.top = `${top}px`;
      }

      function syncMenuLabels(a) {
        const pinned = a && a.getAttribute('data-chat-pinned') === '1';
        const muted = a && a.getAttribute('data-chat-muted') === '1';
        if (btnPin) btnPin.textContent = pinned ? 'برداشتن پین' : 'پین';
        if (btnMute) btnMute.textContent = muted ? 'فعال کردن صدا' : 'بی‌صدا';
      }

      list.addEventListener('click', (e) => {
        const btn = e.target.closest('button.chat-actions-ellipsis');
        if (!btn) return;

        const li = btn.closest('li');
        const a = li ? li.querySelector('a.chat-item') : null;
        if (!li || !a) return;

        e.preventDefault();
        e.stopPropagation();

        if (!menu.classList.contains('hidden') && currentItem === li) {
          closeMenu();
          return;
        }

        currentItem = li;
        syncMenuLabels(a);
        menu.classList.remove('hidden');
        positionMenuNear(btn.getBoundingClientRect());
      });

      menu.addEventListener('click', (e) => {
        const actionBtn = e.target.closest('button[data-action]');
        if (!actionBtn) return;
        e.preventDefault();
        e.stopPropagation();
        if (!currentItem) return;

        const action = actionBtn.getAttribute('data-action');
        const actions = currentItem.querySelector('.group-actions');
        if (!actions) return closeMenu();

        if (action === 'pin') {
          const pinBtn = actions.querySelector('button[hx-post*="/chat/pin/"]');
          if (pinBtn) pinBtn.click();
        }
        if (action === 'mute') {
          const muteBtn = actions.querySelector('button[hx-post*="/chat/mute/"]');
          if (muteBtn) muteBtn.click();
        }
        closeMenu();
      });

      document.addEventListener('click', (e) => {
        if (menu.classList.contains('hidden')) return;
        const insideMenu = e.target.closest('#sidebar_chat_actions_menu');
        const insideBtn = e.target.closest('button.chat-actions-ellipsis');
        if (!insideMenu && !insideBtn) closeMenu();
      });

      window.addEventListener('resize', closeMenu);
      const container = document.getElementById('tg-sidebar');
      if (container) container.addEventListener('scroll', closeMenu, { passive: true });
    }

    function normalizeSearchText(text) {
      return (text || '').toString().toLowerCase().trim();
    }

    function applySidebarSearch() {
      const input = document.getElementById('sidebar-search');
      const q = normalizeSearchText(input ? input.value : '');
      const tab = localStorage.getItem('sidebarTab') || 'chats';
      const results = document.getElementById('sidebar-search-results');
      const content = document.getElementById('sidebar-content');

      if (tab === 'contacts') {
        if (results) {
          results.classList.add('hidden');
          results.innerHTML = '';
        }
        if (content) content.classList.remove('hidden');
        const panel = document.getElementById('tab-contacts-panel');
        if (!panel) return;
        const items = panel.querySelectorAll('ul > li');
        items.forEach(li => {
          if (!q) {
            li.style.display = '';
            return;
          }
          const name = li.querySelector('.text-sm')?.textContent || '';
          const username = li.querySelector('.text-xs')?.textContent || '';
          const haystack = normalizeSearchText(`${name} ${username}`);
          li.style.display = haystack.includes(q) ? '' : 'none';
        });
      } else {
        if (!q) {
          if (results) {
            results.classList.add('hidden');
            results.innerHTML = '';
          }
          if (content) content.classList.remove('hidden');
          return;
        }

        if (content) content.classList.add('hidden');
        if (results) results.classList.remove('hidden');
        scheduleSidebarSearchRequest(q);
      }
    }

    let sidebarSearchTimer = null;
    let sidebarSearchLastQ = "";

    function scheduleSidebarSearchRequest(q) {
      if (sidebarSearchTimer) window.clearTimeout(sidebarSearchTimer);
      sidebarSearchLastQ = q;
      sidebarSearchTimer = window.setTimeout(() => {
        const tab = localStorage.getItem('sidebarTab') || 'chats';
        if (tab !== 'chats') return;
        const results = document.getElementById('sidebar-search-results');
        if (!results) return;
        if (!window.htmx || typeof window.htmx.ajax !== 'function') return;
        const url = `/chat/search/?q=${encodeURIComponent(sidebarSearchLastQ)}`;
        window.htmx.ajax('GET', url, { target: '#sidebar-search-results', swap: 'innerHTML' });
      }, 250);
    }

    function bindSidebarSearch() {
      const input = document.getElementById('sidebar-search');
      if (!input || input.dataset.bound === "1") return;
      input.dataset.bound = "1";
      input.addEventListener('input', applySidebarSearch);
    }

    function refreshSidebarUI() {
      bindSidebarTabs();
      bindSidebarSearch();
      bindSidebarHoverActions();
      bindSidebarPinMuteOptimisticUI();
      bindSidebarChatActionsMenu();

      const tab = localStorage.getItem('sidebarTab') || 'chats';
      setSidebarTab(tab);

      highlightActiveChat();
      rememberLastChatUrl();

      updateMobileLayout();
    }

    function setupPresencePing() {
      if (document.body.dataset.presencePing === "1") return;
      const form = document.getElementById('presence-ping-form');
      if (!form) return;
      document.body.dataset.presencePing = "1";

      const send = () => {
        if (!window.htmx || typeof window.htmx.trigger !== 'function') return;
        window.htmx.trigger(form, 'submit');
      };

      send();
      window.setInterval(send, 30000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) send();
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      refreshSidebarUI();
      setupPresencePing();
    });
    document.body.addEventListener('htmx:afterSwap', refreshSidebarUI);
    document.body.addEventListener('htmx:afterSettle', refreshSidebarUI);
    document.body.addEventListener('htmx:wsAfterMessage', refreshSidebarUI);
    window.addEventListener('popstate', refreshSidebarUI);
    window.addEventListener('resize', refreshSidebarUI);

    function updateMobileLayout() {
      const sidebar = document.getElementById('tg-sidebar');
      const main = document.getElementById('tg-main');
      if (!sidebar || !main) return;
      const backBtn = document.getElementById('tg-back-btn');

      const isMobile = window.matchMedia('(max-width: 767px)').matches;
      if (!isMobile) {
        sidebar.classList.remove('hidden');
        main.classList.remove('hidden');
        if (backBtn) backBtn.classList.add('hidden');
        return;
      }

      const path = window.location.pathname || '';
      const inChat = path.startsWith('/chat/room/');

      if (inChat) {
        sidebar.classList.add('hidden');
        main.classList.remove('hidden');
        if (backBtn) backBtn.classList.remove('hidden');
      } else {
        sidebar.classList.remove('hidden');
        main.classList.add('hidden');
        if (backBtn) backBtn.classList.add('hidden');
      }
    }

    function telegramBack() {
      window.location.href = '/';
    }

    function rememberLastChatUrl() {
      const path = window.location.pathname || '';
      if (path.startsWith('/chat/room/')) localStorage.setItem('lastChatUrl', path);
    }

    function goToLastChatOrHome(e) {
      const lastChatUrl = localStorage.getItem('lastChatUrl') || '';
      if (e) e.preventDefault();
      const home = '/';
      const target = lastChatUrl.startsWith('/chat/room/') ? lastChatUrl : home;

      if (target === home) {
        window.location.href = home;
        return false;
      }

      fetch(target, { method: 'GET', credentials: 'same-origin', redirect: 'follow' })
        .then((res) => {
          if (!res || !res.ok) {
            localStorage.removeItem('lastChatUrl');
            window.location.href = home;
            return;
          }
          try {
            const u = new URL(res.url || home, window.location.origin);
            window.location.href = `${u.pathname}${u.search}${u.hash}`;
          } catch (err) {
            window.location.href = home;
          }
        })
        .catch(() => {
          localStorage.removeItem('lastChatUrl');
          window.location.href = home;
        });
      return false;
    }
  </script>

  <div id="img-modal" class="fixed inset-0 hidden z-[9999] bg-black/70 p-4 items-center justify-center">
    <button id="img-modal-close" type="button" aria-label="بستن" class="absolute top-4 right-4 z-10 inline-flex items-center justify-center h-11 w-11 rounded-full bg-black/55 text-white ring-1 ring-white/20 backdrop-blur hover:bg-black/70 active:bg-black/80">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>
    <img id="img-modal-src" class="max-h-[90vh] max-w-[90vw] rounded-2xl shadow-2xl" alt="Preview" />
  </div>

  <script>
    (function () {
      const modal = document.getElementById('img-modal');
      const modalImg = document.getElementById('img-modal-src');
      const closeBtn = document.getElementById('img-modal-close');
      const MIN_SCALE = 1;
      const MAX_SCALE = 4;
      let scale = 1;
      let translateX = 0;
      let translateY = 0;
      let panStartX = 0;
      let panStartY = 0;
      let panOriginX = 0;
      let panOriginY = 0;
      let pinchStartDistance = 0;
      let pinchStartScale = 1;
      let pinchStartMidX = 0;
      let pinchStartMidY = 0;

      function clamp(n, min, max) {
        return Math.max(min, Math.min(max, n));
      }

      function distance(t1, t2) {
        const dx = t2.clientX - t1.clientX;
        const dy = t2.clientY - t1.clientY;
        return Math.hypot(dx, dy);
      }

      function midpoint(t1, t2) {
        return {
          x: (t1.clientX + t2.clientX) / 2,
          y: (t1.clientY + t2.clientY) / 2,
        };
      }

      function applyTransform() {
        if (!modalImg) return;
        modalImg.style.transform = `translate3d(${translateX}px, ${translateY}px, 0) scale(${scale})`;
      }

      function resetTransform() {
        scale = 1;
        translateX = 0;
        translateY = 0;
        if (!modalImg) return;
        modalImg.style.transformOrigin = 'center center';
        modalImg.style.touchAction = 'none';
        applyTransform();
      }

      function openModal(src) {
        modalImg.src = src;
        resetTransform();
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        modalImg.src = '';
        resetTransform();
        document.body.style.overflow = '';
      }

      if (closeBtn) closeBtn.addEventListener('click', closeModal);

      if (modalImg) {
        modalImg.addEventListener('touchstart', (e) => {
          if (modal.classList.contains('hidden')) return;
          if (!e.touches || e.touches.length === 0) return;

          if (e.touches.length === 2) {
            e.preventDefault();
            pinchStartDistance = distance(e.touches[0], e.touches[1]) || 1;
            pinchStartScale = scale;
            const mid = midpoint(e.touches[0], e.touches[1]);
            pinchStartMidX = mid.x;
            pinchStartMidY = mid.y;
            panOriginX = translateX;
            panOriginY = translateY;
            return;
          }

          if (e.touches.length === 1 && scale > 1) {
            e.preventDefault();
            panStartX = e.touches[0].clientX;
            panStartY = e.touches[0].clientY;
            panOriginX = translateX;
            panOriginY = translateY;
          }
        }, { passive: false });

        modalImg.addEventListener('touchmove', (e) => {
          if (modal.classList.contains('hidden')) return;
          if (!e.touches || e.touches.length === 0) return;

          if (e.touches.length === 2) {
            e.preventDefault();
            const d = distance(e.touches[0], e.touches[1]) || 1;
            const nextScale = clamp((pinchStartScale * d) / pinchStartDistance, MIN_SCALE, MAX_SCALE);

            const mid = midpoint(e.touches[0], e.touches[1]);
            const dx = mid.x - pinchStartMidX;
            const dy = mid.y - pinchStartMidY;

            scale = nextScale;
            translateX = panOriginX + dx;
            translateY = panOriginY + dy;
            applyTransform();
            return;
          }

          if (e.touches.length === 1 && scale > 1) {
            e.preventDefault();
            const dx = e.touches[0].clientX - panStartX;
            const dy = e.touches[0].clientY - panStartY;
            translateX = panOriginX + dx;
            translateY = panOriginY + dy;
            applyTransform();
          }
        }, { passive: false });

        modalImg.addEventListener('touchend', () => {
          if (scale <= 1) resetTransform();
        });
      }

      document.addEventListener('click', (e) => {
        const img = e.target.closest('img[data-zoom-src]');
        if (!img) return;
        openModal(img.dataset.zoomSrc);
      });

      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
      });
    })();
  </script>

  <script>
    (function () {
      const SNAPSHOT_KEY = "rtchatUnreadSnapshotV1";
      let lastSnapshot = null;
      let swRegistration = null;

      function getCsrfToken() {
        const name = "csrftoken=";
        const parts = (document.cookie || "").split(";");
        for (const raw of parts) {
          const c = raw.trim();
          if (c.startsWith(name)) return decodeURIComponent(c.slice(name.length));
        }
        return "";
      }

      function toInt(v) {
        const n = parseInt(String(v || "").trim(), 10);
        return Number.isFinite(n) ? n : 0;
      }

      function readSnapshotFromDom() {
        const map = {};
        const items = document.querySelectorAll("a.chat-item[data-chat-id]");
        items.forEach((a) => {
          const id = (a.getAttribute("data-chat-id") || "").trim();
          if (!id) return;
          map[id] = {
            url: (a.getAttribute("data-chat-url") || "").trim(),
            title: (a.getAttribute("data-chat-title") || "").trim(),
            lastText: (a.getAttribute("data-chat-last-text") || "").trim(),
            unread: toInt(a.getAttribute("data-chat-unread")),
            muted: a.getAttribute("data-chat-muted") === "1",
          };
        });
        return map;
      }

      function loadSnapshot() {
        try {
          const raw = localStorage.getItem(SNAPSHOT_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return null;
          return parsed;
        } catch (e) {
          return null;
        }
      }

      function saveSnapshot(snapshot) {
        try {
          localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(snapshot || {}));
        } catch (e) {
          return;
        }
      }

      function canNotify() {
        return typeof Notification !== "undefined" && Notification.permission === "granted";
      }

      function showChatNotification(chat) {
        if (!canNotify()) return;
        if (!chat || chat.muted) return;
        if (chat.url && (window.location.pathname || "") === chat.url) return;

        const title = chat.title || "پیام جدید";
        const body = chat.lastText || "";
        const url = chat.url || "/";
        const options = { body, icon: "/static/logo.png", badge: "/static/logo.png", data: { url } };

        if (swRegistration && swRegistration.showNotification) {
          swRegistration.showNotification(title, options);
          return;
        }
        try {
          const n = new Notification(title, options);
          n.onclick = () => {
            window.focus();
            window.location.href = url;
            n.close();
          };
        } catch (e) {
          return;
        }
      }

      function metaContent(name) {
        const el = document.querySelector(`meta[name="${name}"]`);
        return (el && (el.getAttribute("content") || "").trim()) || "";
      }

      const APP_VERSION = metaContent("app-version") || "dev";
      const RESET_REQUIRED_DEFAULT = metaContent("app-reset-required") === "1";
      const RESET_MESSAGE_DEFAULT = metaContent("app-reset-message") || "";

      let pwaUpdateReg = null;
      let pwaWaitingWorker = null;
      let pwaPreparedOk = false;
      let pwaPrepareFailed = [];
      let pwaPreparing = false;
      let pwaChecking = false;
      let pwaFlowRunning = false;
      let pwaStatusText = "";
      let pwaStatusKind = "info";
      let pwaPrepareResolver = null;
      let pwaInstallPrompt = null;

      function isAuthenticated() {
        try {
          return document.body && document.body.dataset && document.body.dataset.authenticated === "1";
        } catch (e) {
          return false;
        }
      }

      function isAccountRoute() {
        const p = (window.location && window.location.pathname) ? String(window.location.pathname) : "";
        return p === "/accounts" || p.startsWith("/accounts/");
      }

      function canShowPwaUpdateModal() {
        return isAuthenticated() && !isAccountRoute();
      }

      function markPwaUpdatePending() {
        try {
          sessionStorage.setItem("pwaUpdatePending", "1");
        } catch (e) {
        }
      }

      function clearPwaUpdatePending() {
        try {
          sessionStorage.removeItem("pwaUpdatePending");
        } catch (e) {
        }
      }

      function isStandaloneDisplay() {
        try {
          if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
        } catch (e) {
        }
        try {
          if (window.navigator && window.navigator.standalone) return true;
        } catch (e) {
        }
        return false;
      }

      function isIOS() {
        const ua = String((navigator && navigator.userAgent) || "").toLowerCase();
        return /iphone|ipad|ipod/.test(ua);
      }

      function isIOSStandaloneCapable() {
        if (!isIOS()) return false;
        try {
          return typeof window.navigator.standalone !== "undefined";
        } catch (e) {
          return false;
        }
      }

      function showUpdateModal() {
        if (!canShowPwaUpdateModal()) {
          markPwaUpdatePending();
          return;
        }
        clearPwaUpdatePending();
        const modal = ensureUpdateModal();
        modal.style.display = "flex";
        renderUpdateModal();
      }

      function hideUpdateModal() {
        const modal = document.getElementById("pwa-update-modal");
        if (modal) modal.style.display = "none";
      }

      function renderUpdateModal() {
        if (!canShowPwaUpdateModal()) return;
        const modal = ensureUpdateModal();
        const subtitle = modal.querySelector("#pwa-update-subtitle");
        const alert = modal.querySelector("#pwa-update-alert");
        const status = modal.querySelector("#pwa-update-status");
        const btnRun = modal.querySelector("#pwa-update-run");
        const note = modal.querySelector("#pwa-update-note");

        const resetRequired = RESET_REQUIRED_DEFAULT;
        const resetMessage = RESET_MESSAGE_DEFAULT;

        if (resetRequired) {
          subtitle.textContent = resetMessage ? `این بروزرسانی نیاز به پاکسازی داده‌ها دارد: ${resetMessage}` : "این بروزرسانی نیاز به پاکسازی داده‌ها دارد.";
        } else {
          subtitle.textContent = `نسخه فعلی: ${APP_VERSION}`;
        }

        if (note) note.style.display = resetRequired ? "block" : "none";

        if (alert) {
          if (pwaStatusText) {
            alert.style.display = "block";
            alert.textContent = pwaStatusText;
            if (pwaStatusKind === "error") {
              alert.style.background = "#fef2f2";
              alert.style.borderColor = "#fecaca";
              alert.style.color = "#991b1b";
            } else if (pwaStatusKind === "success") {
              alert.style.background = "#ecfdf5";
              alert.style.borderColor = "#bbf7d0";
              alert.style.color = "#065f46";
            } else {
              alert.style.background = "#eff6ff";
              alert.style.borderColor = "#bfdbfe";
              alert.style.color = "#1d4ed8";
            }
          } else {
            alert.style.display = "none";
          }
        }

        const lines = [];
        const steps = [];
        steps.push(`۱) بررسی: ${pwaWaitingWorker ? "✓" : pwaChecking ? "…" : "—"}`);
        steps.push(`۲) دانلود: ${pwaPreparedOk ? "✓" : pwaPreparing ? "…" : "—"}`);
        steps.push(`۳) اعمال: ${sessionStorage.getItem("pwaApplyUpdate") === "1" ? "…" : "—"}`);
        lines.push(steps.join("   "));
        if (pwaPreparing) lines.push("در حال دانلود بروزرسانی...");
        if (pwaWaitingWorker && !pwaPreparedOk) lines.push("نسخه جدید دریافت شده است، اما دانلود کامل نشده.");
        if (pwaPreparedOk) lines.push("دانلود کامل شد. آماده اعمال بروزرسانی.");
        if (pwaPrepareFailed && pwaPrepareFailed.length) lines.push(`موارد ناموفق: ${pwaPrepareFailed.length}`);
        if (!lines.length) lines.push("برای شروع، «آپدیت» را بزنید.");

        status.textContent = lines.join("\n");
        if (btnRun) {
          btnRun.disabled = pwaFlowRunning || pwaChecking || pwaPreparing || sessionStorage.getItem("pwaApplyUpdate") === "1";
          btnRun.style.opacity = btnRun.disabled ? "0.55" : "1";
          btnRun.style.cursor = btnRun.disabled ? "not-allowed" : "pointer";
          btnRun.textContent = btnRun.disabled ? "در حال انجام..." : "آپدیت";
        }

      async function manualCheckForUpdate() {
        if (!pwaUpdateReg) {
          pwaStatusText = "مرحله ۱ (بررسی): Service Worker فعال نیست.";
          pwaStatusKind = "error";
          showUpdateModal();
          return false;
        }
        if (!navigator.onLine) {
          pwaStatusText = "مرحله ۱ (بررسی): اینترنت قطع است. بعد از وصل شدن دوباره تلاش کنید.";
          pwaStatusKind = "error";
          showUpdateModal();
          return false;
        }

        pwaChecking = true;
        pwaStatusText = "مرحله ۱ (بررسی): در حال بررسی بروزرسانی...";
        pwaStatusKind = "info";
        showUpdateModal();

        try {
          await pwaUpdateReg.update();
        } catch (e) {
          pwaChecking = false;
          pwaStatusText = "مرحله ۱ (بررسی): بررسی بروزرسانی ناموفق بود. دوباره تلاش کنید.";
          pwaStatusKind = "error";
          renderUpdateModal();
          return false;
        }

        if (pwaUpdateReg.waiting) {
          pwaWaitingWorker = pwaUpdateReg.waiting;
          pwaPreparedOk = false;
          pwaPrepareFailed = [];
          pwaStatusText = "مرحله ۱ (بررسی): نسخه جدید پیدا شد.";
          pwaStatusKind = "success";
        } else {
          pwaStatusText = "مرحله ۱ (بررسی): در حال حاضر بروزرسانی جدیدی آماده نیست.";
          pwaStatusKind = "info";
        }
        pwaChecking = false;
        renderUpdateModal();
        return Boolean(pwaUpdateReg.waiting);
      }

      async function prepareUpdate() {
        if (!pwaWaitingWorker) {
          pwaStatusText = "مرحله ۲ (دانلود): هنوز بروزرسانی پیدا نشده است. اول «آپدیت» را بزنید.";
          pwaStatusKind = "error";
          showUpdateModal();
          return false;
        }
        if (!navigator.onLine) {
          pwaStatusText = "مرحله ۲ (دانلود): اینترنت قطع است. بعد از وصل شدن دوباره تلاش کنید.";
          pwaStatusKind = "error";
          showUpdateModal();
          return false;
        }
        if (pwaPreparing) return false;

        pwaPreparing = true;
        pwaPreparedOk = false;
        pwaPrepareFailed = [];
        pwaStatusText = "مرحله ۲ (دانلود): در حال دانلود بروزرسانی...";
        pwaStatusKind = "info";
        showUpdateModal();

        const result = await new Promise((resolve) => {
          const timeout = setTimeout(() => resolve({ ok: false, failed: [], timeout: true }), 45000);
          pwaPrepareResolver = (data) => {
            clearTimeout(timeout);
            resolve(data || { ok: false, failed: [] });
          };
          try {
            pwaWaitingWorker.postMessage("PREPARE_UPDATE");
          } catch (e) {
            clearTimeout(timeout);
            resolve({ ok: false, failed: [] });
          }
        });

        pwaPreparing = false;
        pwaPreparedOk = Boolean(result && result.ok);
        pwaPrepareFailed = (result && result.failed) || [];
        if (pwaPreparedOk) {
          pwaStatusText = "مرحله ۲ (دانلود): دانلود بروزرسانی کامل شد.";
          pwaStatusKind = "success";
        } else if (result && result.timeout) {
          pwaStatusText = "مرحله ۲ (دانلود): دانلود زمان‌بر شد. اینترنت ناپایدار است؛ دوباره تلاش کنید.";
          pwaStatusKind = "error";
        } else {
          pwaStatusText = "مرحله ۲ (دانلود): دانلود کامل نشد. دوباره تلاش کنید.";
          pwaStatusKind = "error";
        }
        renderUpdateModal();
        return pwaPreparedOk;
      }

      async function applyUpdate() {
        if (!pwaWaitingWorker) {
          pwaStatusText = "مرحله ۳ (اعمال): هیچ بروزرسانی آماده نیست.";
          pwaStatusKind = "error";
          showUpdateModal();
          return false;
        }
        if (!pwaPreparedOk) {
          pwaStatusText = "مرحله ۳ (اعمال): ابتدا دانلود بروزرسانی را کامل کنید.";
          pwaStatusKind = "error";
          showUpdateModal();
          return false;
        }
        const needsCleanup = RESET_REQUIRED_DEFAULT;

        sessionStorage.setItem("pwaApplyUpdate", "1");
        if (needsCleanup) sessionStorage.setItem("pwaCleanupPending", "1");
        else sessionStorage.removeItem("pwaCleanupPending");

        pwaStatusText = "مرحله ۳ (اعمال): در حال اعمال بروزرسانی...";
        pwaStatusKind = "info";
        renderUpdateModal();

        try {
          pwaWaitingWorker.postMessage("SKIP_WAITING");
        } catch (e) {
          sessionStorage.removeItem("pwaApplyUpdate");
          pwaStatusText = "مرحله ۳ (اعمال): اعمال بروزرسانی ناموفق بود. دوباره تلاش کنید.";
          pwaStatusKind = "error";
          showUpdateModal();
          return false;
        }
        hideUpdateModal();
        return true;
      }

      async function runFullUpdate() {
        if (!canShowPwaUpdateModal()) {
          markPwaUpdatePending();
          return;
        }
        if (pwaFlowRunning) return;
        pwaFlowRunning = true;
        pwaStatusText = "";
        pwaStatusKind = "info";
        showUpdateModal();

        try {
          if (!pwaWaitingWorker) {
            const hasUpdate = await manualCheckForUpdate();
            if (!hasUpdate) return;
          }
          if (!pwaPreparedOk) {
            const ok = await prepareUpdate();
            if (!ok) return;
          }
          await applyUpdate();
        } finally {
          pwaFlowRunning = false;
          const modal = document.getElementById("pwa-update-modal");
          if (modal && modal.style && modal.style.display !== "none") renderUpdateModal();
        }
      }

      async function cleanupSiteDataIfNeeded() {
        if (sessionStorage.getItem("pwaCleanupPending") !== "1") return;
        sessionStorage.removeItem("pwaCleanupPending");

        try {
          if ("caches" in window) {
            const names = await caches.keys();
            await Promise.all(names.map((n) => caches.delete(n)));
          }
        } catch (e) {
        }

        try {
          if (typeof indexedDB !== "undefined") {
            const dbs = indexedDB.databases ? await indexedDB.databases() : [];
            await Promise.all(
              (dbs || [])
                .map((db) => (db && db.name ? db.name : ""))
                .filter(Boolean)
                .map(
                  (name) =>
                    new Promise((resolve) => {
                      const req = indexedDB.deleteDatabase(name);
                      req.onsuccess = () => resolve(true);
                      req.onerror = () => resolve(false);
                      req.onblocked = () => resolve(false);
                    })
                )
            );
          }
        } catch (e) {
        }

        try {
          localStorage.clear();
        } catch (e) {
        }

        try {
          window.location.reload();
        } catch (e) {
        }
      }

      async function registerServiceWorker() {
        if (!("serviceWorker" in navigator)) return null;
        try {
          const reg = await navigator.serviceWorker.register(`/sw.js?v=${encodeURIComponent(APP_VERSION)}`, {
            updateViaCache: "none",
          });
          swRegistration = reg;
          pwaUpdateReg = reg;

          navigator.serviceWorker.addEventListener("message", (e) => {
            const data = e && e.data;
            if (!data || data.type !== "PWA_UPDATE_PREPARED") return;
            if (typeof pwaPrepareResolver === "function") {
              const fn = pwaPrepareResolver;
              pwaPrepareResolver = null;
              fn(data);
            }
          });

          if (!document.body.dataset.swReloadBound) {
            document.body.dataset.swReloadBound = "1";
            navigator.serviceWorker.addEventListener("controllerchange", () => {
              if (sessionStorage.getItem("pwaApplyUpdate") === "1") {
                sessionStorage.removeItem("pwaApplyUpdate");
                window.location.reload();
              }
            });
          }

          if (reg.waiting) {
            pwaWaitingWorker = reg.waiting;
            pwaPreparedOk = false;
            pwaPrepareFailed = [];
            pwaStatusText = "نسخه جدید آماده است.";
            showUpdateModal();
          }

          reg.addEventListener("updatefound", () => {
            const w = reg.installing;
            if (!w) return;
            w.addEventListener("statechange", () => {
              if (w.state === "installed" && navigator.serviceWorker.controller) {
                pwaWaitingWorker = reg.waiting || w;
                pwaPreparedOk = false;
                pwaPrepareFailed = [];
                pwaStatusText = "نسخه جدید دریافت شد و آماده دانلود است.";
                showUpdateModal();
              }
            });
          });

          return reg;
        } catch (e) {
          return null;
        }
      }

      async function ensureNotificationPermission() {
        if (typeof Notification === "undefined") return false;
        if (Notification.permission === "granted") return true;
        if (Notification.permission === "denied") return false;
        try {
          const res = await Notification.requestPermission();
          return res === "granted";
        } catch (e) {
          return false;
        }
      }

      function urlBase64ToUint8Array(base64String) {
        const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
        const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
        return outputArray;
      }

      async function fetchVapidPublicKey() {
        try {
          const res = await fetch("/pwa/vapid-public-key", { credentials: "same-origin" });
          if (!res.ok) return "";
          const data = await res.json();
          return (data && data.publicKey) || "";
        } catch (e) {
          return "";
        }
      }

      async function sendSubscriptionToServer(subscription) {
        try {
          const csrf = getCsrfToken();
          const res = await fetch("/pwa/subscribe", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json", "X-CSRFToken": csrf },
            body: JSON.stringify(subscription),
          });
          return res.ok;
        } catch (e) {
          return false;
        }
      }

      async function ensurePushSubscription() {
        if (!swRegistration || !swRegistration.pushManager) return;
        if (!canNotify()) return;

        const existing = await swRegistration.pushManager.getSubscription();
        if (existing) {
          await sendSubscriptionToServer(existing.toJSON ? existing.toJSON() : existing);
          return;
        }

        const publicKey = await fetchVapidPublicKey();
        if (!publicKey) return;

        try {
          const subscription = await swRegistration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(publicKey),
          });
          await sendSubscriptionToServer(subscription.toJSON ? subscription.toJSON() : subscription);
        } catch (e) {
          return;
        }
      }

      function handleSidebarChangeForNotifications() {
        const nextSnapshot = readSnapshotFromDom();
        const prevSnapshot = lastSnapshot || {};

        Object.keys(nextSnapshot).forEach((id) => {
          const next = nextSnapshot[id];
          const prev = prevSnapshot[id] || {};
          const nextUnread = toInt(next.unread);
          const prevUnread = toInt(prev.unread);
          if (nextUnread > prevUnread && !next.muted) showChatNotification(next);
        });

        lastSnapshot = nextSnapshot;
        saveSnapshot(nextSnapshot);
      }

      window.addEventListener("beforeinstallprompt", (e) => {
        if (isStandaloneDisplay()) return;
        try {
          if (sessionStorage.getItem("pwaInstallDismissed") === "1") return;
        } catch (err) {
        }
        try {
          e.preventDefault();
        } catch (err) {
        }
        pwaInstallPrompt = e;
        showInstallModal();
      });

      window.addEventListener("appinstalled", () => {
        pwaInstallPrompt = null;
        hideInstallModal();
      });

      document.addEventListener("DOMContentLoaded", async () => {
        lastSnapshot = loadSnapshot() || readSnapshotFromDom();
        await cleanupSiteDataIfNeeded();
        await registerServiceWorker();
        try {
          if (sessionStorage.getItem("pwaUpdatePending") === "1" && canShowPwaUpdateModal() && pwaWaitingWorker) {
            showUpdateModal();
          }
        } catch (e) {
        }
        if (canNotify()) await ensurePushSubscription();
        if (!isStandaloneDisplay() && !pwaInstallPrompt) {
          try {
            if (sessionStorage.getItem("pwaInstallDismissed") !== "1" && isIOSStandaloneCapable()) {
              showInstallModal();
            }
          } catch (e) {
          }
        }
      });

      document.body.addEventListener("htmx:wsAfterMessage", () => {
        setTimeout(handleSidebarChangeForNotifications, 0);
      });

      document.addEventListener(
        "click",
        async () => {
          const ok = await ensureNotificationPermission();
          if (ok) await ensurePushSubscription();
        },
        { once: true, capture: true }
      );
    })();
  </script>

  {% block javascript %}{% endblock %}
</body>
</html>

<form action="{% url 'profile-usernamechange' %}" method="post" class="flex gap-2 text-black" autocomplete="off">
    {% csrf_token %}
    {% for field in form %}{{ field }}{% endfor %}
    <button class="button block !bg-gray-800" type="submit">Submit</button>
</form>

<a hx-swap-oob="true" id="username-edit" href="{% url 'profile-settings' %}" class="font-medium text-gray-700 hover:text-gray-900 hover:underline">
    Cancel
</a>

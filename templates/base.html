      function showUpdateModal() {
        if (!canShowPwaUpdateModal()) {
          markPwaUpdatePending();
          return;
        }
        clearPwaUpdatePending();
        const modal = ensureUpdateModal();
        modal.style.display = "flex";
        renderUpdateModal();
      }

      function hideUpdateModal() {
        const modal = document.getElementById("pwa-update-modal");
        if (modal) modal.style.display = "none";
      }

      function renderUpdateModal() {
        if (!canShowPwaUpdateModal()) return;
        const modal = ensureUpdateModal();
        const subtitle = modal.querySelector("#pwa-update-subtitle");
        const alert = modal.querySelector("#pwa-update-alert");
        const status = modal.querySelector("#pwa-update-status");
        const btnRun = modal.querySelector("#pwa-update-run");
        const note = modal.querySelector("#pwa-update-note");

        const resetRequired = RESET_REQUIRED_DEFAULT;
        const resetMessage = RESET_MESSAGE_DEFAULT;

        if (resetRequired) {
          subtitle.textContent = resetMessage ? `این بروزرسانی نیاز به پاکسازی داده‌ها دارد: ${resetMessage}` : "این بروزرسانی نیاز به پاکسازی داده‌ها دارد.";
        } else {
          subtitle.textContent = `نسخه فعلی: ${APP_VERSION}`;
        }

        if (note) note.style.display = resetRequired ? "block" : "none";

        if (alert) {
          if (pwaStatusText) {
            alert.style.display = "block";
            alert.textContent = pwaStatusText;
            if (pwaStatusKind === "error") {
              alert.style.background = "#fef2f2";
              alert.style.borderColor = "#fecaca";
              alert.style.color = "#991b1b";
            } else if (pwaStatusKind === "success") {
              alert.style.background = "#ecfdf5";
              alert.style.borderColor = "#bbf7d0";
              alert.style.color = "#065f46";
            } else {
              alert.style.background = "#eff6ff";
              alert.style.borderColor = "#bfdbfe";
              alert.style.color = "#1d4ed8";
            }
          } else {
            alert.style.display = "none";
          }
        }

        const lines = [];
        const steps = [];
        steps.push(`۱) بررسی: ${pwaWaitingWorker ? "✓" : pwaChecking ? "…" : "—"}`);
        steps.push(`۲) دانلود: ${pwaPreparedOk ? "✓" : pwaPreparing ? "…" : "—"}`);
        steps.push(`۳) اعمال: ${sessionStorage.getItem("pwaApplyUpdate") ? "…" : "—"}`);
        lines.push(steps.join("   "));
        if (pwaPreparing) lines.push("در حال دانلود بروزرسانی...");
        if (pwaWaitingWorker && !pwaPreparedOk) lines.push("نسخه جدید دریافت شده است، اما دانلود کامل نشده.");
        if (pwaPreparedOk) lines.push("دانلود کامل شد. آماده اعمال بروزرسانی.");
        if (pwaPrepareFailed && pwaPrepareFailed.length) lines.push(`موارد ناموفق: ${pwaPrepareFailed.length}`);
        if (!lines.length) lines.push("برای شروع، «آپدیت» را بزنید.");

        status.textContent = lines.join("\n");
        if (btnRun) {
          btnRun.disabled = pwaFlowRunning || pwaChecking || pwaPreparing || Boolean(sessionStorage.getItem("pwaApplyUpdate"));
          btnRun.style.opacity = btnRun.disabled ? "0.55" : "1";
          btnRun.style.cursor = btnRun.disabled ? "not-allowed" : "pointer";
          btnRun.textContent = btnRun.disabled ? "در حال انجام..." : "آپدیت";
        }
      }

      async function manualCheckForUpdate() {
        if (!pwaUpdateReg) {
          pwaStatusText = "مرحله ۱ (بررسی): Service Worker فعال نیست.";
          pwaStatusKind = "error";
          showUpdateModal();
          return false;
        }
        if (!rtchatIsOnline()) {
          pwaStatusText = "مرحله ۱ (بررسی): اینترنت قطع است. بعد از وصل شدن دوباره تلاش کنید.";
          pwaStatusKind = "error";
          showUpdateModal();
          return false;
        }

        pwaChecking = true;
        pwaStatusText = "مرحله ۱ (بررسی): در حال بررسی بروزرسانی...";
        pwaStatusKind = "info";
        showUpdateModal();

        try {
          await pwaUpdateReg.update();
        } catch (e) {
          pwaChecking = false;
          pwaStatusText = "مرحله ۱ (بررسی): بررسی بروزرسانی ناموفق بود. دوباره تلاش کنید.";
          pwaStatusKind = "error";
          renderUpdateModal();
          return false;
        }

        if (pwaUpdateReg.waiting) {
          pwaWaitingWorker = pwaUpdateReg.waiting;
          pwaPreparedOk = false;
          pwaPrepareFailed = [];
          pwaStatusText = "مرحله ۱ (بررسی): نسخه جدید پیدا شد.";
          pwaStatusKind = "success";
        } else {
          pwaStatusText = "مرحله ۱ (بررسی): در حال حاضر بروزرسانی جدیدی آماده نیست.";
          pwaStatusKind = "info";
        }
        pwaChecking = false;
        renderUpdateModal();
        return Boolean(pwaUpdateReg.waiting);
      }

      async function prepareUpdate() {
        if (!pwaWaitingWorker) {
          pwaStatusText = "مرحله ۲ (دانلود): هنوز بروزرسانی پیدا نشده است. اول «آپدیت» را بزنید.";
          pwaStatusKind = "error";
          showUpdateModal();
          return false;
        }
        if (!rtchatIsOnline()) {
          pwaStatusText = "مرحله ۲ (دانلود): اینترنت قطع است. بعد از وصل شدن دوباره تلاش کنید.";
          pwaStatusKind = "error";
          showUpdateModal();
          return false;
        }
        if (pwaPreparing) return false;

        pwaPreparing = true;
        pwaPreparedOk = false;
        pwaPrepareFailed = [];
        pwaStatusText = "مرحله ۲ (دانلود): در حال دانلود بروزرسانی...";
        pwaStatusKind = "info";
        showUpdateModal();

        const result = await new Promise((resolve) => {
          const timeout = setTimeout(() => resolve({ ok: false, failed: [], timeout: true }), 45000);
          pwaPrepareResolver = (data) => {
            clearTimeout(timeout);
            resolve(data || { ok: false, failed: [] });
          };
          try {
            pwaWaitingWorker.postMessage("PREPARE_UPDATE");
          } catch (e) {
            clearTimeout(timeout);
            resolve({ ok: false, failed: [] });
          }
        });

        pwaPreparing = false;
        pwaPreparedOk = Boolean(result && result.ok);
        pwaPrepareFailed = (result && result.failed) || [];
        if (pwaPreparedOk) {
          pwaStatusText = "مرحله ۲ (دانلود): دانلود بروزرسانی کامل شد.";
          pwaStatusKind = "success";
        } else if (result && result.timeout) {
          pwaStatusText = "مرحله ۲ (دانلود): دانلود زمان‌بر شد. اینترنت ناپایدار است؛ دوباره تلاش کنید.";
          pwaStatusKind = "error";
        } else {
          pwaStatusText = "مرحله ۲ (دانلود): دانلود کامل نشد. دوباره تلاش کنید.";
          pwaStatusKind = "error";
        }
        renderUpdateModal();
        return pwaPreparedOk;
      }

      async function applyUpdate() {
        if (!pwaWaitingWorker) {
          pwaStatusText = "مرحله ۳ (اعمال): هیچ بروزرسانی آماده نیست.";
          pwaStatusKind = "error";
          showUpdateModal();
          return false;
        }
        if (pwaWaitingWorker.state === 'activated' || pwaWaitingWorker.state === 'activating') {
          window.location.reload();
          return true;
        }
        if (!pwaPreparedOk) {
          pwaStatusText = "مرحله ۳ (اعمال): ابتدا دانلود بروزرسانی را کامل کنید.";
          pwaStatusKind = "error";
          showUpdateModal();
          return false;
        }
        const needsCleanup = RESET_REQUIRED_DEFAULT;

        sessionStorage.setItem("pwaApplyUpdate", Date.now().toString());
        if (needsCleanup) sessionStorage.setItem("pwaCleanupPending", "1");
        else sessionStorage.removeItem("pwaCleanupPending");

        pwaStatusText = "مرحله ۳ (اعمال): در حال اعمال بروزرسانی...";
        pwaStatusKind = "info";
        renderUpdateModal();

        try {
          pwaWaitingWorker.postMessage("SKIP_WAITING");
        } catch (e) {
          sessionStorage.removeItem("pwaApplyUpdate");
          pwaStatusText = "مرحله ۳ (اعمال): اعمال بروزرسانی ناموفق بود. دوباره تلاش کنید.";
          pwaStatusKind = "error";
          showUpdateModal();
          return false;
        }
        hideUpdateModal();
        return true;
      }

      async function runFullUpdate() {
        if (!canShowPwaUpdateModal()) {
          markPwaUpdatePending();
          return;
        }
        if (pwaFlowRunning) return;
        pwaFlowRunning = true;

        try {
          if (pwaWaitingWorker) {
            pwaStatusText = "";
            pwaStatusKind = "info";
            showUpdateModal();

            if (!pwaPreparedOk) {
              const ok = await prepareUpdate();
              if (!ok) return;
            }
            await applyUpdate();
            return;
          }

          pwaStatusText = "در حال بروزرسانی...";
          pwaStatusKind = "info";
          showUpdateModal();

          try {
            if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all((regs || []).map((r) => r && r.unregister ? r.unregister() : null));
            }
          } catch (e) {
          }

          try {
            if ("caches" in window) {
              const cacheNames = await caches.keys();
              await Promise.all(cacheNames.map((n) => caches.delete(n)));
            }
          } catch (e) {
          }

          try {
            window.location.reload(true);
          } catch (e) {
            window.location.reload();
          }
        } finally {
          pwaFlowRunning = false;
          const modal = document.getElementById("pwa-update-modal");
          if (modal && modal.style && modal.style.display !== "none") renderUpdateModal();
        }
      }

      async function cleanupSiteDataIfNeeded() {
        if (sessionStorage.getItem("pwaCleanupPending") !== "1") return;
        sessionStorage.removeItem("pwaCleanupPending");

        const isFullReset = RESET_REQUIRED_DEFAULT;

        const preserve = {};
        if (!isFullReset) {
          const keepKeys = ['theme', 'sidebarTab', 'lastChatUrl'];
          try {
            keepKeys.forEach((k) => {
              const v = localStorage.getItem(k);
              if (v !== null) preserve[k] = v;
            });
          } catch (e) {
          }
        }

        try {
          if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all((regs || []).map((r) => (r && r.unregister ? r.unregister() : false)));
          }
        } catch (e) {
        }

        try {
          if ("caches" in window) {
            const names = await caches.keys();
            await Promise.all(names.map((n) => caches.delete(n)));
          }
        } catch (e) {
        }

        if (isFullReset) {
          try {
            if (typeof indexedDB !== "undefined") {
              const dbs = indexedDB.databases ? await indexedDB.databases() : [];
              await Promise.all(
                (dbs || [])
                  .map((db) => (db && db.name ? db.name : ""))
                  .filter(Boolean)
                  .map(
                    (name) =>
                      new Promise((resolve) => {
                        const req = indexedDB.deleteDatabase(name);
                        req.onsuccess = () => resolve(true);
                        req.onerror = () => resolve(false);
                        req.onblocked = () => resolve(false);
                      })
                  )
              );
            }
          } catch (e) {
          }
        }

        try {
          localStorage.clear();
        } catch (e) {
        }

        try {
          Object.keys(preserve).forEach((k) => {
            localStorage.setItem(k, preserve[k]);
          });
          localStorage.setItem(APP_VERSION_KEY, APP_VERSION);
        } catch (e) {
        }

        try {
          window.location.reload();
        } catch (e) {
        }
      }

      async function registerServiceWorker() {
        if (!("serviceWorker" in navigator)) {
          return null;
        }
        try {
          const reg = await navigator.serviceWorker.register(`/sw.js?v=${encodeURIComponent(APP_VERSION)}`, {
            updateViaCache: "none",
          });
          swRegistration = reg;
          pwaUpdateReg = reg;

          navigator.serviceWorker.addEventListener("message", (e) => {
            const data = e && e.data;

            if (data && data.type === "SW_ACTIVATED") {
              const swVer = (data.version || "").toString().trim();
              // مقایسه با ورژنی که صفحه باهاش لود شده بود
              let pageVerAtLoad = '';
              try { pageVerAtLoad = sessionStorage.getItem(PAGE_VERSION_AT_LOAD_KEY) || APP_VERSION; } catch(e) {}
              if (swVer && pageVerAtLoad && swVer !== pageVerAtLoad) {
                try { sessionStorage.setItem(PAGE_VERSION_AT_LOAD_KEY, swVer); } catch(e) {}
                window.location.reload();
              }
              return;
            }

            if (!data || data.type !== "PWA_UPDATE_PREPARED") return;
            if (typeof pwaPrepareResolver === "function") {
              const fn = pwaPrepareResolver;
              pwaPrepareResolver = null;
              fn(data);
            }
          });

          if (!document.body.dataset.swReloadBound) {
            document.body.dataset.swReloadBound = "1";
            navigator.serviceWorker.addEventListener("controllerchange", () => {
              const val = sessionStorage.getItem("pwaApplyUpdate");
              if (val) {
                const ts = parseInt(val, 10);
                if (!isNaN(ts) && Date.now() - ts < 60000) {
                  sessionStorage.removeItem("pwaApplyUpdate");
                  window.location.reload();
                } else {
                  sessionStorage.removeItem("pwaApplyUpdate");
                }
                return;
              }
              // SW جدید بدون درخواست کاربر activate شد
              // ورژن رو از scriptURL چک کن
              try {
                const ctrl = navigator.serviceWorker.controller;
                const swUrl = ctrl ? ctrl.scriptURL : '';
                const swVerMatch = swUrl.match(/[?&]v=([^&]+)/);
                const swVer = swVerMatch ? decodeURIComponent(swVerMatch[1]) : '';
                let pageVerAtLoad = APP_VERSION;
                try { pageVerAtLoad = sessionStorage.getItem(PAGE_VERSION_AT_LOAD_KEY) || APP_VERSION; } catch(e) {}
                if (swVer && pageVerAtLoad && swVer !== pageVerAtLoad) {
                  // ورژن SW با ورژن صفحه فرق داره — modal نشون بده
                  pwaStatusText = "نسخه جدید نصب شد. برای اعمال تغییرات، آپدیت را بزنید.";
                  pwaStatusKind = "info";
                  showUpdateModal();
                }
              } catch(e) {
              }
            });
          }

          if (reg.waiting) {
            pwaWaitingWorker = reg.waiting;
            pwaPreparedOk = false;
            pwaPrepareFailed = [];
            pwaStatusText = "نسخه جدید آماده است.";
            showUpdateModal();
          }

          reg.addEventListener("updatefound", () => {
            const w = reg.installing;
            if (!w) return;
            w.addEventListener("statechange", () => {
              if (w.state === "installed" && navigator.serviceWorker.controller) {
                // SW جدید waiting — tab قدیمی هنوز باز بود (desktop/android)
                pwaWaitingWorker = reg.waiting || w;
                pwaPreparedOk = false;
                pwaPrepareFailed = [];
                pwaStatusText = "نسخه جدید دریافت شد و آماده دانلود است.";
                showUpdateModal();
              }
            });
          });

          // Poll every 5s to detect if waiting worker appears after registration
          let pollCount = 0;
          const pollTimer = setInterval(() => {
            pollCount++;
            if (pollCount > 12) { clearInterval(pollTimer); return; } // stop after 1 min
            if (reg.waiting && !pwaWaitingWorker) {
              pwaWaitingWorker = reg.waiting;
              pwaPreparedOk = false;
              pwaPrepareFailed = [];
              pwaStatusText = "نسخه جدید آماده است.";
              showUpdateModal();
              clearInterval(pollTimer);
            }
          }, 5000);

          return reg;
        } catch (e) {
          return null;
        }
      }

      async function ensureNotificationPermission() {
        if (typeof Notification === "undefined") return false;
        if (Notification.permission === "granted") return true;
        if (Notification.permission === "denied") return false;
        try {
          const res = await Notification.requestPermission();
          return res === "granted";
        } catch (e) {
          return false;
        }
      }

      function urlBase64ToUint8Array(base64String) {
        const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
        const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
        return outputArray;
      }

      async function fetchVapidPublicKey() {
        try {
          const res = await fetch("/pwa/vapid-public-key", { credentials: "same-origin" });
          if (!res.ok) return "";
          const data = await res.json();
          return (data && data.publicKey) || "";
        } catch (e) {
          return "";
        }
      }

      async function sendSubscriptionToServer(subscription) {
        try {
          const csrf = getCsrfToken();
          const res = await fetch("/pwa/subscribe", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json", "X-CSRFToken": csrf },
            body: JSON.stringify(subscription),
          });
          return res.ok;
        } catch (e) {
          return false;
        }
      }

      async function ensurePushSubscription() {
        if (!swRegistration || !swRegistration.pushManager) return;
        if (!canNotify()) return;

        const existing = await swRegistration.pushManager.getSubscription();
        if (existing) {
          hasPushSubscription = true;
          await sendSubscriptionToServer(existing.toJSON ? existing.toJSON() : existing);
          return;
        }

        const publicKey = await fetchVapidPublicKey();
        if (!publicKey) return;

        try {
          const subscription = await swRegistration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(publicKey),
          });
          hasPushSubscription = true;
          await sendSubscriptionToServer(subscription.toJSON ? subscription.toJSON() : subscription);
        } catch (e) {
          return;
        }
      }

      function handleSidebarChangeForNotifications() {
        const nextSnapshot = readSnapshotFromDom();
        if (!nextSnapshot || Object.keys(nextSnapshot).length === 0) return;

        const persistedSnapshot = loadSnapshot() || {};
        const prevSnapshot =
          lastSnapshot && Object.keys(lastSnapshot).length ? lastSnapshot : persistedSnapshot || {};

        Object.keys(nextSnapshot).forEach((id) => {
          const next = nextSnapshot[id];
          const prev = prevSnapshot[id] || persistedSnapshot[id] || {};
          const nextUnread = toInt(next.unread);
          const prevUnread = toInt(prev.unread);
          if (nextUnread > prevUnread && !next.muted) showChatNotification(next);
        });

        lastSnapshot = mergeSnapshots(prevSnapshot, nextSnapshot);
        saveSnapshot(lastSnapshot);
      }

      window.addEventListener("beforeinstallprompt", (e) => {
        if (isStandaloneDisplay()) return;
        try {
          if (sessionStorage.getItem("pwaInstallDismissed") === "1") return;
        } catch (err) {
        }
        try {
          e.preventDefault();
        } catch (err) {
        }
        pwaInstallPrompt = e;
        showInstallModal();
      });

      window.addEventListener("appinstalled", () => {
        pwaInstallPrompt = null;
        hideInstallModal();
      });

      document.addEventListener("DOMContentLoaded", async () => {
        lastSnapshot = mergeSnapshots(loadSnapshot() || {}, readSnapshotFromDom());
        saveSnapshot(lastSnapshot);
        await cleanupSiteDataIfNeeded();
        await registerServiceWorker();
        try {
          const pending = sessionStorage.getItem("pwaUpdatePending") === "1";
          if (pending && canShowPwaUpdateModal() && pwaWaitingWorker) {
            showUpdateModal();
          }
        } catch (e) {
        }
        if (canNotify()) await ensurePushSubscription();
        if (!isStandaloneDisplay() && !pwaInstallPrompt) {
          try {
            if (sessionStorage.getItem("pwaInstallDismissed") !== "1" && isIOSStandaloneCapable()) {
              showInstallModal();
            }
          } catch (e) {
          }
        }
      });

      document.body.addEventListener("htmx:wsAfterMessage", () => {
        setTimeout(handleSidebarChangeForNotifications, 0);
      });

      document.addEventListener(
        "click",
        async () => {
          try {
            const ok = await ensureNotificationPermission();
            if (!ok) return;
            if (!swRegistration) {
              await registerServiceWorker();
            }
            await ensurePushSubscription();
          } catch (e) {
            return;
          }
        },
        { once: true, capture: true }
      );
    })();
  </script>
  <script>
    (function () {
      if (window.__rtchatConnInit) return;
      window.__rtchatConnInit = true;

      const statusWrap = document.getElementById("conn_status_wrap");
      const statusBar = document.getElementById("conn_status_bar");
      const statusText = document.getElementById("conn_status_text");
      const statusDuration = document.getElementById("conn_status_duration");
      const statusIcon = document.getElementById("conn_status_icon");
      const statusRetry = document.getElementById("conn_status_retry");
      const chatRoot = document.getElementById("chat_root");
      const messageForm = document.getElementById("chat_message_form");
      const chatsList = document.getElementById("chats-list");
      const contactsList = document.getElementById("contacts-list");

      let toastContainer = null;
      let offlineStartedAt = null;
      let wsConnected = null;
      let wsDisconnectedAt = null;
      let lastState = "";
      let successTimer = 0;
      let tickTimer = 0;
      let reconnectTimer = 0;
      let lastKeyboardOpen = false;
      const initialGraceUntil = Date.now() + 1500;

      function ensureToastContainer() {
        if (toastContainer && toastContainer.isConnected) return toastContainer;
        const existing = document.getElementById("conn_toast_container");
        if (existing) {
          toastContainer = existing;
          return existing;
        }
        const el = document.createElement("div");
        el.id = "conn_toast_container";
        el.className = "fixed left-1/2 -translate-x-1/2 z-[90] flex flex-col gap-2 items-center";
        document.body.appendChild(el);
        toastContainer = el;
        return el;
      }

      function showToast(message, duration = 3500) {
        const container = ensureToastContainer();
        if (!container) return;
        const toast = document.createElement("div");
        toast.className =
          "max-w-[90vw] rounded-xl bg-slate-900/90 text-white text-sm font-medium px-4 py-2 shadow-lg ring-1 ring-black/10 backdrop-blur transition-all duration-200 opacity-0 translate-y-1";
        toast.textContent = String(message || "");
        container.appendChild(toast);
        requestAnimationFrame(() => {
          toast.classList.remove("opacity-0", "translate-y-1");
          toast.classList.add("opacity-100", "translate-y-0");
        });
        const removeLater = () => {
          toast.classList.remove("opacity-100", "translate-y-0");
          toast.classList.add("opacity-0", "translate-y-1");
          setTimeout(() => toast.remove(), 220);
        };
        setTimeout(removeLater, Math.max(1200, Number(duration || 0)));
      }

      function formatDuration(ms) {
        const total = Math.max(0, Math.floor(ms / 1000));
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      }

      function setIcon(type) {
        if (!statusIcon) return;
        statusIcon.innerHTML = "";
        const el = document.createElement("span");
        if (type === "spinner") {
          el.className = "rtchat-spinner";
        } else {
          el.className = "rtchat-dot";
        }
        statusIcon.appendChild(el);
      }

      function setDimmed(on) {
        if (chatsList) chatsList.classList.toggle("conn-dimmed", on);
        if (contactsList) contactsList.classList.toggle("conn-dimmed", on);
      }

      function setState(state) {
        if (!statusWrap || !statusBar) return;
        if (state === lastState) return;
        lastState = state;
        clearTimeout(successTimer);
        const base = "flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-medium";
        if (state === "hidden") {
          statusWrap.classList.add("hidden");
          return;
        }
        statusWrap.classList.remove("hidden");
        statusBar.className = base;
        statusRetry && statusRetry.classList.add("hidden");
        if (state === "offline") {
          statusBar.classList.add("bg-red-50", "text-red-700", "border", "border-red-200", "dark:bg-red-900/60", "dark:text-red-300", "dark:border-red-500/30");
          statusText && (statusText.textContent = "اتصال اینترنت قطع است.");
          setIcon("dot");
        } else if (state === "reconnecting") {
          statusBar.classList.add("bg-amber-50", "text-amber-700", "border", "border-amber-200", "dark:bg-amber-900/60", "dark:text-amber-300", "dark:border-amber-500/30");
          statusText && (statusText.textContent = "در حال اتصال مجدد…");
          setIcon("spinner");
        } else if (state === "server") {
          statusBar.classList.add("bg-purple-50", "text-purple-700", "border", "border-purple-200", "dark:bg-purple-900/60", "dark:text-purple-300", "dark:border-purple-500/30");
          statusText && (statusText.textContent = "مشکل در اتصال به سرور.");
          setIcon("dot");
          statusRetry && statusRetry.classList.remove("hidden");
        } else if (state === "online") {
          statusBar.classList.add("bg-emerald-50", "text-emerald-700", "border", "border-emerald-200", "dark:bg-emerald-900/60", "dark:text-emerald-300", "dark:border-emerald-500/30");
          statusText && (statusText.textContent = "اتصال برقرار شد.");
          setIcon("dot");
          successTimer = setTimeout(() => setState("hidden"), 2500);
        }
      }

      function updateDuration() {
        if (!statusDuration) return;
        if (!offlineStartedAt || lastState === "online" || lastState === "hidden") {
          statusDuration.textContent = "";
          return;
        }
        statusDuration.textContent = `مدت قطع: ${formatDuration(Date.now() - offlineStartedAt)}`;
      }

      function startTicker() {
        if (tickTimer) return;
        tickTimer = setInterval(updateDuration, 1000);
      }

      function stopTicker() {
        if (tickTimer) {
          clearInterval(tickTimer);
          tickTimer = 0;
        }
      }

      function attemptReconnect() {
        if (!messageForm) return;
        if (window.htmx && typeof window.htmx.process === "function") window.htmx.process(messageForm);
        if (window.htmx && typeof window.htmx.trigger === "function") window.htmx.trigger(messageForm, "htmx:wsReconnect");
      }

      function startReconnectTimer() {
        if (reconnectTimer) return;
        reconnectTimer = setInterval(() => {
          const online = typeof window.rtchatIsOnline === "function" ? window.rtchatIsOnline() : (typeof navigator === "undefined" ? true : navigator.onLine !== false);
          if (!online) return;
          if (wsConnected) return;
          attemptReconnect();
        }, 5000);
      }

      function stopReconnectTimer() {
        if (reconnectTimer) {
          clearInterval(reconnectTimer);
          reconnectTimer = 0;
        }
      }

      function updateConnectivity() {
        const online = typeof window.rtchatIsOnline === "function" ? window.rtchatIsOnline() : (typeof navigator === "undefined" ? true : navigator.onLine !== false);
        if (!online) {
          if (!offlineStartedAt) offlineStartedAt = Date.now();
          wsConnected = false;
          wsDisconnectedAt = wsDisconnectedAt || Date.now();
          chatRoot && chatRoot.classList.add("rtchat-offline");
          setDimmed(true);
          setState("offline");
          startTicker();
          stopReconnectTimer();
          updateDuration();
          return;
        }

        if (chatRoot) chatRoot.classList.remove("rtchat-offline");

        if (wsConnected === null && Date.now() < initialGraceUntil) {
          setDimmed(false);
          setState("hidden");
          stopTicker();
          return;
        }

        if (!wsConnected) {
          const baseAt = wsDisconnectedAt || offlineStartedAt || Date.now();
          offlineStartedAt = offlineStartedAt || baseAt;
          const age = Date.now() - baseAt;
          if (age < 15000) setState("reconnecting");
          else setState("server");
          setDimmed(true);
          startTicker();
          startReconnectTimer();
          updateDuration();
          return;
        }

        setDimmed(false);
        if (offlineStartedAt || lastState === "reconnecting" || lastState === "server" || lastState === "offline") {
          setState("online");
        } else {
          setState("hidden");
        }
        offlineStartedAt = null;
        wsDisconnectedAt = null;
        stopTicker();
        stopReconnectTimer();
        updateDuration();
      }

      function handleWsOpen() {
        wsConnected = true;
        updateConnectivity();
      }

      function handleWsDisconnected() {
        wsConnected = false;
        wsDisconnectedAt = wsDisconnectedAt || Date.now();
        updateConnectivity();
      }

      function updateViewportMetrics() {
        const vv = window.visualViewport;
        let top = 0;
        let keyboardOffset = 0;
        if (vv) {
          top = Number(vv.offsetTop || 0);
          const height = Number(vv.height || window.innerHeight || 0);
          const innerH = Number(window.innerHeight || height);
          keyboardOffset = Math.max(0, innerH - height - top);
        }
        document.documentElement.style.setProperty("--conn-vv-top", `${top}px`);
        document.documentElement.style.setProperty("--conn-keyboard-offset", `${keyboardOffset}px`);
        if (document.body) {
          const open = keyboardOffset > 0;
          if (open !== lastKeyboardOpen) {
            document.body.classList.toggle("conn-keyboard-open", open);
            lastKeyboardOpen = open;
          }
        }
      }

      function bindViewportListeners() {
        updateViewportMetrics();
        const vv = window.visualViewport;
        if (vv && !vv.__rtchatConnBound) {
          vv.__rtchatConnBound = true;
          vv.addEventListener("resize", updateViewportMetrics);
          vv.addEventListener("scroll", updateViewportMetrics);
        }
        window.addEventListener("resize", updateViewportMetrics);
        if (!vv) {
          document.addEventListener("focusin", () => {
            document.documentElement.style.setProperty("--conn-keyboard-offset", "180px");
            if (document.body) document.body.classList.add("conn-keyboard-open");
          });
          document.addEventListener("focusout", () => {
            setTimeout(() => {
              document.documentElement.style.setProperty("--conn-keyboard-offset", "0px");
              if (document.body) document.body.classList.remove("conn-keyboard-open");
            }, 150);
          });
        }
      }

      if (statusRetry) {
        statusRetry.addEventListener("click", () => {
          attemptReconnect();
          updateConnectivity();
        });
      }

      document.body && document.body.addEventListener("htmx:wsOpen", handleWsOpen);
      document.body && document.body.addEventListener("htmx:wsClose", handleWsDisconnected);
      document.body && document.body.addEventListener("htmx:wsError", handleWsDisconnected);
      window.addEventListener("online", updateConnectivity);
      window.addEventListener("offline", updateConnectivity);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          attemptReconnect();
          updateConnectivity();
        }
      });
      window.addEventListener("focus", () => {
        attemptReconnect();
        updateConnectivity();
      });

      window.rtchatShowConnToast = showToast;
      window.rtchatIsConnected = function () {
        const online = typeof window.rtchatIsOnline === "function" ? window.rtchatIsOnline() : (typeof navigator === "undefined" ? true : navigator.onLine !== false);
        return online && wsConnected === true;
      };
      window.rtchatRefreshConnectionUI = updateConnectivity;
      window.rtchatAttemptReconnect = attemptReconnect;

      bindViewportListeners();
      setTimeout(updateConnectivity, 1600);
      updateConnectivity();
    })();
  </script>

  <script src="{% static 'vendor/jszip.min.js' %}?v={{ APP_VERSION|urlencode }}" defer></script>
  <script src="{% static 'vendor/docx-preview.min.js' %}?v={{ APP_VERSION|urlencode }}" defer></script>
  <script src="{% static 'vendor/xlsx.full.min.js' %}?v={{ APP_VERSION|urlencode }}" defer></script>

  <script src="{% static 'js/chat_runtime.js' %}?v={{ APP_VERSION|urlencode }}"></script>

  {% block javascript %}{% endblock %}

</body>
</html>

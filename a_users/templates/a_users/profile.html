{% extends 'layouts/blank.html' %}

{% block content %}

<div class="md:hidden sticky top-0 z-10 border-b bg-white px-4 py-3">
    <div class="flex items-center justify-between">
        <a href="/" onclick="return goToLastChatOrHome(event)" class="-ml-2 p-2 rounded-lg bg-transparent text-gray-600 hover:text-gray-900 hover:bg-gray-100 active:bg-gray-200">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </a>
        <div class="min-w-0 px-3 text-sm font-semibold text-gray-900 truncate">My profile</div>
        <a href="/" onclick="return goToLastChatOrHome(event)" class="text-sm font-medium text-gray-500 hover:text-gray-900">Cancel</a>
    </div>
</div>

<div class="hidden md:flex max-w-lg mx-auto px-4 pt-10 items-center justify-between">
    <a href="/" onclick="return goToLastChatOrHome(event)" class="-ml-2 p-2 rounded-lg bg-transparent text-gray-600 hover:text-gray-900 hover:bg-gray-100 active:bg-gray-200">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
    </a>
    <a href="/" onclick="return goToLastChatOrHome(event)" class="text-sm font-medium text-gray-500 hover:text-gray-900">Cancel</a>
</div>

<div class="max-w-lg mx-auto flex flex-col items-center pt-10 md:pt-20 px-4">
    <img class="w-36 h-36 rounded-full object-cover mb-4" src="{{ profile.avatar }}" />
    <div class="text-center">
        <h1>{{ profile.name }}</h1>
        <div class="text-gray-400 mb-2 -mt-3">@{{ profile.user.username }}</div>
        {% if profile.info %}
        <div class="mt-8 hyphens-auto">{{ profile.info|linebreaksbr }}</div>
        {% endif %}
        {% if profile.user != user %}
        <a class="button" href="{% url 'start-chat' profile.user.username %}">Chat with {{ profile.name }}</a>
        {% endif %}
    </div>
</div>

{% endblock %}

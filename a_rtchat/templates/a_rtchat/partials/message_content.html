{% if message.body %}
  {{ message.body|linebreaksbr }}
{% endif %}

{% if message.file %}
  {% if message.is_image %}
    <img
      src="{{ message.file.url }}"
      data-zoom-src="{{ message.file.url }}"
      alt="{{ message.filename }}"
      class="mt-2 max-h-64 w-auto rounded-xl object-cover cursor-zoom-in select-none"
      loading="lazy"
    />
  {% elif message.is_audio %}
    <div class="mt-2 w-full js-audio-msg" data-audio-src="{{ message.file.url }}">
      <audio class="hidden js-audio" preload="metadata">
        <source src="{{ message.file.url }}" type="{{ message.mime_type }}">
      </audio>

      <div class="flex items-center gap-3">
        <button type="button" class="js-audio-toggle h-10 w-10 rounded-full bg-green-500 text-white flex items-center justify-center">
          <svg class="js-audio-icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"></path>
          </svg>
          <svg class="js-audio-icon-pause hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 5h4v14H6zM14 5h4v14h-4z"></path>
          </svg>
        </button>

        <div class="flex-1 min-w-0">
          <div class="js-audio-seek relative h-6 w-full cursor-pointer select-none rounded-full bg-green-50 overflow-hidden">
            <div class="absolute inset-0 opacity-70"
                 style="background-image: repeating-linear-gradient(90deg, rgba(34,197,94,0.45) 0 2px, transparent 2px 6px);"></div>
            <div class="js-audio-progress absolute inset-y-0 left-0 w-0 bg-green-200"></div>
            <div class="absolute inset-0"
                 style="background-image: repeating-linear-gradient(90deg, rgba(34,197,94,0.55) 0 2px, transparent 2px 6px); mix-blend-mode: multiply;"></div>
          </div>
          <div class="mt-1 flex justify-start">
            <span class="js-audio-duration text-[11px] text-green-700">0:00</span>
          </div>
        </div>
      </div>
    </div>
  {% else %}
    <a href="{{ message.file.url }}" download
       class="mt-2 inline-flex items-center gap-2 text-sm text-blue-600 hover:underline">
      📎 {{ message.filename }}
    </a>
  {% endif %}
{% endif %}

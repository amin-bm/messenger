{% load static %}
{% load django_htmx %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Django Template">
  <title>Project Title</title>

  <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://unpkg.com/htmx.org/dist/htmx.js"></script>
  <script src="https://unpkg.com/htmx.org/dist/ext/ws.js"></script>
  {% django_htmx_script %}
  <script src="https://unpkg.com/hyperscript.org@0.9.12"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style type="text/tailwindcss">
    [x-cloak]{ display:none !important; }

    h1 { @apply text-4xl font-bold mb-4 }
    h2 { @apply text-xl font-bold mb-2 }
    h3 { @apply text-lg font-bold }
    p  { @apply mb-4 }

    .button, button, [type='submit'], [type='button'] {
      @apply bg-indigo-600 text-white font-bold rounded-lg shadow-lg transition-all cursor-pointer;
    }
    .button, button a, [type='submit'], [type='button'] {
      @apply px-6 py-4 inline-block;
    }
    .button:hover, button:hover, [type='submit']:hover, [type='button']:hover { @apply bg-indigo-700 }
    .button:active, button:active, [type='submit']:active, [type='button']:active { @apply scale-95 }

    .button.alert, button.alert { @apply bg-red-700 }
    .button.alert:hover, button.alert:hover { @apply bg-red-600 }

    .button-red { @apply !bg-red-500 hover:!bg-red-600 }
    .button-gray { @apply !bg-gray-300 hover:!bg-[#c3c9d0] }

    .navitems>li>a { @apply flex items-center gap-2 h-12 px-4 hover:bg-[rgba(31,41,55,0.3)] rounded-lg; }

    .hoverlist>* { @apply hover:bg-gray-100 rounded-md transition duration-150; }
    .hoverlist>*>a { @apply flex items-center p-2; }

    .highlight { @apply !bg-indigo-100; }

    .allauth content a { @apply underline underline-offset-2; }
    .allauth content a:hover { @apply text-indigo-500; }

    label { @apply hidden }
    input[type=file] { @apply bg-white pl-0 }
    .textarea, textarea, input { @apply w-full rounded-lg py-4 px-5 bg-gray-100 }
    .errorlist li { @apply p-1 pl-4 border-l-red-500 border-l-4 border-solid mb-2 text-red-500 }

    .alert-info { @apply bg-sky-500 }
    .alert-success { @apply bg-green-500 }
    .alert-warning { @apply bg-red-500 }
    .alert-danger { @apply bg-red-500 }

    .gray-dot { @apply rounded-full bg-gray-500 p-1.5 }
    .green-dot { @apply rounded-full bg-green-500 p-1.5 }
    .graylight-dot { @apply rounded-full bg-gray-300 p-1.5 }

    /* Sidebar items base style (safe even if structure changes) */
    #chats-list a.chat-item { @apply rounded-xl; }

    /* wrapper شبیه کپسول */
    .tabs-pill{
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: 14px;
      background: #f1f5f9;          /* slate-100 */
      border: 1px solid #e2e8f0;     /* slate-200 */
    }

/* دکمه‌ها */
.sidebar-tab{
  appearance: none;
  border: 0;
  background: transparent;
  color: #64748b;               /* slate-500 */
  font-size: 12px;
  font-weight: 600;
  padding: 8px 10px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  line-height: 1;
  transition: background .15s ease, color .15s ease, box-shadow .15s ease;
}

.sidebar-tab:hover{
  background: rgba(15, 23, 42, 0.06);  /* slate-900/6% */
  color: #0f172a;                      /* slate-900 */
}

.sidebar-tab:focus{
  outline: none;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); /* blue ring */
}

/* حالت فعال */
.sidebar-tab.active{
  background: #ffffff;
  color: #0f172a;
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
}

/* badge مینیمال */
.tab-badge{
  min-width: 18px;
  height: 18px;
  padding: 0 6px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  background: rgba(37, 99, 235, 0.12); /* blue-600/12% */
  color: #1d4ed8;                      /* blue-700 */
}

    
  </style>
</head>

<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="{% block class %}{% endblock %}">

  {% include 'includes/messages.html' %}
  {% include 'includes/header.html' %}

  {% block layout %}{% endblock %}

  {% if user.is_authenticated %}
    <footer hx-ext="ws" ws-connect="/ws/online-status/"></footer>
  {% endif %}

  <script>
    // ---------- Tabs ----------
    function setSidebarTab(tab) {
      localStorage.setItem('sidebarTab', tab);

      const chatsPanel = document.getElementById('tab-chats-panel');
      const contactsPanel = document.getElementById('tab-contacts-panel');
      const tabs = document.querySelectorAll('.sidebar-tab');

      if (!chatsPanel || !contactsPanel || !tabs.length) return;

      if (tab === 'contacts') {
        chatsPanel.classList.add('hidden');
        contactsPanel.classList.remove('hidden');
      } else {
        contactsPanel.classList.add('hidden');
        chatsPanel.classList.remove('hidden');
      }

      tabs.forEach(btn => {
        const isActive = btn.dataset.tab === tab;
        btn.classList.toggle('bg-white', isActive);
        btn.classList.toggle('text-gray-900', isActive);
        btn.classList.toggle('shadow', isActive);
        btn.classList.toggle('text-gray-600', !isActive);
      });
    }

    function bindSidebarTabs() {
      if (document.body.dataset.tabsBound === "1") return;
      document.body.dataset.tabsBound = "1";

      document.body.addEventListener('click', (e) => {
        const btn = e.target.closest('.sidebar-tab');
        if (!btn) return;
        setSidebarTab(btn.dataset.tab || 'chats');
      });
    }

    // ---------- Active highlight ----------
    function highlightActiveChat() {
        const path = window.location.pathname;
        document.querySelectorAll('#chats-list a.chat-item').forEach(a => {
            const url = a.getAttribute('data-chat-url');
            if (url && path === url) a.classList.add('bg-blue-100');
            else a.classList.remove('bg-blue-100');
        });
        }


    // ---------- Hover actions (Pin/Mute) with delegation ----------
    function bindSidebarHoverActions() {
      const list = document.getElementById('chats-list');
      if (!list || list.dataset.bound === "1") return;
      list.dataset.bound = "1";

      list.addEventListener('mouseover', (e) => {
        const a = e.target.closest('a.chat-item');
        if (!a) return;
        const actions = a.querySelector('.group-actions');
        if (actions) actions.style.display = 'flex';
      });

      list.addEventListener('mouseout', (e) => {
        const a = e.target.closest('a.chat-item');
        if (!a) return;
        const actions = a.querySelector('.group-actions');
        if (actions) actions.style.display = 'none';
      });
    }

    function refreshSidebarUI() {
      bindSidebarTabs();
      bindSidebarHoverActions();

      const tab = localStorage.getItem('sidebarTab') || 'chats';
      setSidebarTab(tab);

      highlightActiveChat();
    }

    document.addEventListener('DOMContentLoaded', refreshSidebarUI);

    // HTMX swaps + WS messages can replace the sidebar fragment
    document.body.addEventListener('htmx:afterSwap', refreshSidebarUI);
    document.body.addEventListener('htmx:afterSettle', refreshSidebarUI);
    document.body.addEventListener('htmx:wsAfterMessage', refreshSidebarUI);

    // Back/forward navigation
    window.addEventListener('popstate', refreshSidebarUI);
  </script>

  {% block javascript %}{% endblock %}
</body>
</html>

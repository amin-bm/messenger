{% extends 'layouts/box.html' %}

{% block mobile_title %}Delete account{% endblock %}

{% block content %}

<h1>Delete Account</h1>
<p>Are you sure you want to delete your account?</p>

<form method='POST'>
    {% csrf_token %}
    <button type="submit" class="button button-red mt-6">Yes, I want to delete my account</button>
    <a class="ml-3 text-sm font-medium text-gray-500 hover:text-gray-900" href="/">Cancel</a>
</form>

{% endblock %}

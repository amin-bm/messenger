{% if chat_group.is_private %}
  {% if online_count > 0 %}
    <div id="online-icon" hx-swap-oob="outerHTML" class="green-dot absolute -bottom-1 -right-1"></div>
  {% else %}
    <div id="online-icon" hx-swap-oob="outerHTML" class="gray-dot absolute -bottom-1 -right-1"></div>
  {% endif %}
{% else %}
  {% if chat_group.groupchat_name %}
    <span id="online-count" hx-swap-oob="outerHTML" class="hidden"></span>
  {% else %}
    <span id="online-count" hx-swap-oob="outerHTML" class="pr-1">{{ online_count }}</span>
  {% endif %}
{% endif %}

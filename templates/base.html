{% load static %}
{% load django_htmx %}
<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Django Template">
  <title>Pesk Messenger</title>

  <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}?v={{ APP_VERSION|urlencode }}">
  <link rel="manifest" href="/manifest.webmanifest?v={{ APP_VERSION|urlencode }}">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pesk Messenger">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'pwa-apple-touch-180.png' %}?v={{ APP_VERSION|urlencode }}">
  <meta name="app-version" content="{{ APP_VERSION|escape }}">
  <meta name="app-reset-required" content="{% if APP_RESET_REQUIRED %}1{% else %}0{% endif %}">
  <meta name="app-reset-message" content="{{ APP_RESET_MESSAGE|default:''|escape }}">
  <meta name="ignore-navigator-online" content="{% if IGNORE_NAVIGATOR_ONLINE %}1{% else %}0{% endif %}">

  <script>
    (function () {
      try {
        var loc = window.location;
        var isLocal = loc.hostname === 'localhost' || loc.hostname === '127.0.0.1' || /\.local$/.test(loc.hostname);
        if (loc.protocol === 'http:' && !isLocal) {
          var target = 'https://' + loc.host + loc.pathname + loc.search + loc.hash;
          window.location.replace(target);
        }
      } catch (e) {
      }
    })();
  </script>

  <script>
    (function () {
      try {
        var dir = sessionStorage.getItem('tgNavDir') || '';
        var root = document.documentElement;
        if (dir === 'forward') root.classList.add('tg-nav-forward');
        else if (dir === 'back') root.classList.add('tg-nav-back');
      } catch (e) {
      }
    })();
  </script>

  <script>
    (function () {
      const storageKey = 'theme';
      const root = document.documentElement;
      const metaThemeColor = document.querySelector('meta[name="theme-color"]');

      function systemPrefersDark() {
        return Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      }

      function getMode() {
        const mode = localStorage.getItem(storageKey);
        return mode === 'dark' || mode === 'light' ? mode : 'dark';
      }

      function setMode(mode) {
        if (mode === 'dark' || mode === 'light') localStorage.setItem(storageKey, mode);
        else localStorage.removeItem(storageKey);
      }

      function applyMode(mode) {
        const isDark = mode === 'dark' || (mode === 'system' && systemPrefersDark());
        root.classList.toggle('dark', isDark);
        root.dataset.theme = mode;
        if (metaThemeColor) metaThemeColor.setAttribute('content', isDark ? '#0b1220' : '#0ea5e9');
      }

      function toggleTheme() {
        const isDark = root.classList.contains('dark');
        const next = isDark ? 'light' : 'dark';
        setMode(next);
        applyMode(next);
      }

      const initial = getMode();
      applyMode(initial);

      if (window.matchMedia) {
        const mql = window.matchMedia('(prefers-color-scheme: dark)');
        const onChange = () => {
          const current = getMode();
          if (current === 'system') applyMode('system');
        };
        if (typeof mql.addEventListener === 'function') mql.addEventListener('change', onChange);
        else if (typeof mql.addListener === 'function') mql.addListener(onChange);
      }

      window.setThemeMode = (mode) => {
        const next = mode === 'dark' || mode === 'light' ? mode : 'system';
        setMode(next);
        applyMode(next);
      };
      window.toggleTheme = toggleTheme;

      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-theme-toggle]');
        if (!btn) return;
        e.preventDefault();
        toggleTheme();
      });
    })();
  </script>

  <script src="{% static 'vendor/alpine.min.js' %}?v={{ APP_VERSION|urlencode }}" defer></script>
  <script src="{% static 'vendor/htmx.min.js' %}?v={{ APP_VERSION|urlencode }}"></script>
  <script src="{% static 'vendor/ws.min.js' %}?v={{ APP_VERSION|urlencode }}"></script>
  <script src="{% static 'vendor/hyperscript.min.js' %}?v={{ APP_VERSION|urlencode }}"></script>

  <!-- ✅ Tailwind output built by CLI (local / offline) -->
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}?v={{ APP_VERSION|urlencode }}">
  <link rel="stylesheet" href="{% static 'css/fonts.css' %}?v={{ APP_VERSION|urlencode }}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v={{ APP_VERSION|urlencode }}">
  <style>
    :root {
      --conn-vv-top: 0px;
      --conn-keyboard-offset: 0px;
      --conn-toast-base: 112px;
    }
    #conn_status_wrap {
      position: fixed;
      top: calc(var(--conn-vv-top, 0px) + 10px);
      left: 0;
      right: 0;
      z-index: 90;
      padding: 0 16px;
      pointer-events: none;
    }
    #conn_status_bar {
      pointer-events: auto;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }
    #conn_toast_container {
      bottom: var(--conn-toast-base, 112px);
      transition: bottom 0.2s ease;
    }
    body.conn-keyboard-open #conn_toast_container {
      bottom: calc(var(--conn-toast-base, 112px) + var(--conn-keyboard-offset, 0px));
    }
    #chats-list.conn-dimmed,
    #contacts-list.conn-dimmed {
      filter: blur(0.6px);
      opacity: 0.6;
      transition: filter 0.2s ease, opacity 0.2s ease;
    }
    .rtchat-spinner {
      width: 14px;
      height: 14px;
      border-radius: 9999px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: currentColor;
      animation: rtchatSpin 0.9s linear infinite;
    }
    @keyframes rtchatSpin {
      to { transform: rotate(360deg); }
    }
    .rtchat-dot {
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      background: currentColor;
      display: inline-block;
    }
    .rtchat-shake {
      animation: rtchatShake 0.45s ease;
    }
    @keyframes rtchatShake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      50% { transform: translateX(3px); }
      75% { transform: translateX(-3px); }
      100% { transform: translateX(0); }
    }
    #chat_root.rtchat-offline #chat_messages {
      filter: blur(0.7px);
      opacity: 0.7;
      transition: filter 0.2s ease, opacity 0.2s ease;
    }
    @media (max-width: 767px) {
      #tg-sidebar,
      #tg-main {
        will-change: transform;
        transform: translateZ(0);
      }

      html.tg-nav-forward #tg-main {
        animation: tgEnterFromLeft 220ms cubic-bezier(.2,.8,.2,1) both;
      }
      html.tg-nav-back #tg-sidebar {
        animation: tgEnterFromRight 220ms cubic-bezier(.2,.8,.2,1) both;
      }
      html.tg-leave-forward #tg-sidebar {
        animation: tgExitToLeft 140ms cubic-bezier(.2,.8,.2,1) both;
      }
      html.tg-leave-back #tg-main {
        animation: tgExitToRight 140ms cubic-bezier(.2,.8,.2,1) both;
      }

      @keyframes tgEnterFromRight {
        from { transform: translateX(-100%); }
        to { transform: translateX(0); }
      }
      @keyframes tgExitToLeft {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(-18%); opacity: 0.98; }
      }
      @keyframes tgEnterFromLeft {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      @keyframes tgExitToRight {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(18%); opacity: 0.98; }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html.tg-nav-forward #tg-main,
      html.tg-nav-back #tg-sidebar,
      html.tg-leave-forward #tg-sidebar,
      html.tg-leave-back #tg-main {
        animation: none !important;
      }
    }
  </style>
</head>

<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' data-authenticated="{% if user.is_authenticated %}1{% else %}0{% endif %}" class="{% block class %}{% endblock %}">

  {% include 'includes/messages.html' %}

  {% block layout %}{% endblock %}

  <div id="sidebar_chat_actions_menu" class="fixed hidden z-[9998]">
    <div class="min-w-[170px] overflow-hidden rounded-xl bg-white/90 shadow-xl ring-1 ring-black/10 backdrop-blur-xl dark:bg-slate-900/90 dark:ring-white/10">
      <button type="button" data-action="pin" class="w-full px-4 py-3 text-right text-sm text-gray-800 hover:bg-gray-50 active:bg-gray-100 dark:text-slate-100 dark:hover:bg-white/10 dark:active:bg-white/15">پین</button>
      <button type="button" data-action="mute" class="w-full px-4 py-3 text-right text-sm text-gray-800 hover:bg-gray-50 active:bg-gray-100 dark:text-slate-100 dark:hover:bg-white/10 dark:active:bg-white/15">بی‌صدا</button>
    </div>
  </div>

  <script>
    // ---------- Tabs ----------
    function setSidebarTab(tab) {
      localStorage.setItem('sidebarTab', tab);

      const chatsPanel = document.getElementById('tab-chats-panel');
      const contactsPanel = document.getElementById('tab-contacts-panel');
      const tabs = document.querySelectorAll('.sidebar-tab');

      if (!chatsPanel || !contactsPanel || !tabs.length) return;

      if (tab === 'contacts') {
        chatsPanel.classList.add('hidden');
        contactsPanel.classList.remove('hidden');
      } else {
        contactsPanel.classList.add('hidden');
        chatsPanel.classList.remove('hidden');
      }

      tabs.forEach(btn => {
        const isActive = btn.dataset.tab === tab;
        btn.classList.toggle('active', isActive);
      });

      applySidebarSearch();
    }

    function bindSidebarTabs() {
      if (document.body.dataset.tabsBound === "1") return;
      document.body.dataset.tabsBound = "1";

      document.body.addEventListener('click', (e) => {
        const btn = e.target.closest('.sidebar-tab');
        if (!btn) return;
        setSidebarTab(btn.dataset.tab || 'chats');
      });
    }

    // ---------- Active highlight ----------
    function highlightActiveChat() {
      const normalizePath = (p) => {
        const s = (p || '').toString().trim().replace(/\/+$/, '');
        return s || '/';
      };
      const path = normalizePath(window.location.pathname);
      document.querySelectorAll('#chats-list a.chat-item').forEach(a => {
        const url = a.getAttribute('data-chat-url');
        a.classList.toggle('highlight', Boolean(url && path === normalizePath(url)));
      });
    }

    // ---------- Hover actions (Pin/Mute) with delegation ----------
    function bindSidebarHoverActions() {
      const list = document.getElementById('chats-list');
      if (!list) return;

      const supportsHover = Boolean(
        window.matchMedia &&
          (window.matchMedia('(hover: hover)').matches || window.matchMedia('(any-hover: hover)').matches)
      );
      if (!supportsHover) return;

      if (list.dataset.hoverBound === "1") return;
      list.dataset.hoverBound = "1";

      function showActions(li) {
        const actions = li ? li.querySelector('.group-actions') : null;
        if (actions) {
          actions.classList.remove('hidden');
          actions.style.display = 'flex';
        }
        const ellipsis = li ? li.querySelector('.chat-actions-ellipsis') : null;
        if (ellipsis) ellipsis.style.display = 'none';
      }

      function hideActions(li) {
        const actions = li ? li.querySelector('.group-actions') : null;
        if (actions) {
          actions.style.display = 'none';
          actions.classList.add('hidden');
        }
        const ellipsis = li ? li.querySelector('.chat-actions-ellipsis') : null;
        if (ellipsis) ellipsis.style.display = '';
      }

      list.addEventListener('mouseover', (e) => {
        const li = e.target.closest('li.chat-row');
        if (!li || !list.contains(li)) return;
        showActions(li);
      });

      list.addEventListener('mouseout', (e) => {
        const li = e.target.closest('li.chat-row');
        if (!li || !list.contains(li)) return;
        const related = e.relatedTarget;
        if (related && li.contains(related)) return;
        hideActions(li);
      });
    }

    function bindSidebarPinMuteOptimisticUI() {
      if (document.body.dataset.pinMuteBound === "1") return;
      document.body.dataset.pinMuteBound = "1";

      document.body.addEventListener('htmx:afterRequest', (e) => {
        const detail = e.detail || {};
        if (!detail.successful) return;

        const elt = detail.elt;
        if (!elt) return;

        const btn = elt.closest('button[hx-post]');
        if (!btn) return;

        const url = (btn.getAttribute('hx-post') || '').toString();
        const isPin = url.includes('/chat/pin/');
        const isMute = url.includes('/chat/mute/');
        if (!isPin && !isMute) return;

        const li = btn.closest('li.chat-row');
        const a = li ? li.querySelector('a.chat-item') : null;
        if (!li || !a) return;

        const key = isPin ? 'data-chat-pinned' : 'data-chat-muted';
        const current = a.getAttribute(key) === '1';
        const next = !current;
        a.setAttribute(key, next ? '1' : '0');

        const indicator = li.querySelector(isPin ? '[data-indicator="pinned"]' : '[data-indicator="muted"]');
        if (indicator) indicator.classList.toggle('hidden', !next);
      });
    }

    function bindSidebarChatActionsMenu() {
      const list = document.getElementById('chats-list');
      const menu = document.getElementById('sidebar_chat_actions_menu');
      if (!list || !menu) return;

      const isTouchPointer =
        (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
        (typeof navigator !== 'undefined' && (navigator.maxTouchPoints || 0) > 0);
      if (!isTouchPointer) return;

      if (list.dataset.actionsBound === "1") return;
      list.dataset.actionsBound = "1";

      const btnPin = menu.querySelector('[data-action="pin"]');
      const btnMute = menu.querySelector('[data-action="mute"]');
      let currentItem = null;

      function closeMenu() {
        menu.classList.add('hidden');
        menu.style.left = '';
        menu.style.top = '';
        currentItem = null;
      }

      function positionMenuNear(rect) {
        const vw = window.innerWidth || 0;
        const vh = window.innerHeight || 0;
        const margin = 8;

        const mw = menu.offsetWidth || 0;
        const mh = menu.offsetHeight || 0;

        let left = rect.right - mw;
        let top = rect.bottom + 8;

        if (left + mw + margin > vw) left = vw - mw - margin;
        if (left < margin) left = margin;
        if (top + mh + margin > vh) top = rect.top - mh - 8;
        if (top < margin) top = margin;

        menu.style.left = `${left}px`;
        menu.style.top = `${top}px`;
      }

      function syncMenuLabels(a) {
        const pinned = a && a.getAttribute('data-chat-pinned') === '1';
        const muted = a && a.getAttribute('data-chat-muted') === '1';
        if (btnPin) btnPin.textContent = pinned ? 'برداشتن پین' : 'پین';
        if (btnMute) btnMute.textContent = muted ? 'فعال کردن صدا' : 'بی‌صدا';
      }

      list.addEventListener('click', (e) => {
        const btn = e.target.closest('button.chat-actions-ellipsis');
        if (!btn) return;

        const li = btn.closest('li');
        const a = li ? li.querySelector('a.chat-item') : null;
        if (!li || !a) return;

        e.preventDefault();
        e.stopPropagation();

        if (!menu.classList.contains('hidden') && currentItem === li) {
          closeMenu();
          return;
        }

        currentItem = li;
        syncMenuLabels(a);
        menu.classList.remove('hidden');
        positionMenuNear(btn.getBoundingClientRect());
      });

      menu.addEventListener('click', (e) => {
        const actionBtn = e.target.closest('button[data-action]');
        if (!actionBtn) return;
        e.preventDefault();
        e.stopPropagation();
        if (!currentItem) return;

        const action = actionBtn.getAttribute('data-action');
        const actions = currentItem.querySelector('.group-actions');
        if (!actions) return closeMenu();

        if (action === 'pin') {
          const pinBtn = actions.querySelector('button[hx-post*="/chat/pin/"]');
          if (pinBtn) pinBtn.click();
        }
        if (action === 'mute') {
          const muteBtn = actions.querySelector('button[hx-post*="/chat/mute/"]');
          if (muteBtn) muteBtn.click();
        }
        closeMenu();
      });

      document.addEventListener('click', (e) => {
        if (menu.classList.contains('hidden')) return;
        const insideMenu = e.target.closest('#sidebar_chat_actions_menu');
        const insideBtn = e.target.closest('button.chat-actions-ellipsis');
        if (!insideMenu && !insideBtn) closeMenu();
      });

      window.addEventListener('resize', closeMenu);
      const container = document.getElementById('tg-sidebar');
      if (container) container.addEventListener('scroll', closeMenu, { passive: true });
    }

    function normalizeSearchText(text) {
      return (text || '').toString().toLowerCase().trim();
    }

    function applySidebarSearch() {
      const input = document.getElementById('sidebar-search');
      const q = normalizeSearchText(input ? input.value : '');
      const tab = localStorage.getItem('sidebarTab') || 'chats';
      const results = document.getElementById('sidebar-search-results');
      const content = document.getElementById('sidebar-content');

      if (tab === 'contacts') {
        if (results) {
          results.classList.add('hidden');
          results.innerHTML = '';
        }
        if (content) content.classList.remove('hidden');
        const panel = document.getElementById('tab-contacts-panel');
        if (!panel) return;
        const items = panel.querySelectorAll('ul > li');
        items.forEach(li => {
          if (!q) {
            li.style.display = '';
            return;
          }
          const name = li.querySelector('.text-sm')?.textContent || '';
          const username = li.querySelector('.text-xs')?.textContent || '';
          const haystack = normalizeSearchText(`${name} ${username}`);
          li.style.display = haystack.includes(q) ? '' : 'none';
        });
      } else {
        if (!q) {
          if (results) {
            results.classList.add('hidden');
            results.innerHTML = '';
          }
          if (content) content.classList.remove('hidden');
          return;
        }

        if (content) content.classList.add('hidden');
        if (results) results.classList.remove('hidden');
        scheduleSidebarSearchRequest(q);
      }
    }

    let sidebarSearchTimer = null;
    let sidebarSearchLastQ = "";

    function scheduleSidebarSearchRequest(q) {
      if (sidebarSearchTimer) window.clearTimeout(sidebarSearchTimer);
      sidebarSearchLastQ = q;
      sidebarSearchTimer = window.setTimeout(() => {
        const tab = localStorage.getItem('sidebarTab') || 'chats';
        if (tab !== 'chats') return;
        const results = document.getElementById('sidebar-search-results');
        if (!results) return;
        if (!window.htmx || typeof window.htmx.ajax !== 'function') return;
        const url = `/chat/search/?q=${encodeURIComponent(sidebarSearchLastQ)}`;
        window.htmx.ajax('GET', url, { target: '#sidebar-search-results', swap: 'innerHTML' });
      }, 250);
    }

    function bindSidebarSearch() {
      const input = document.getElementById('sidebar-search');
      if (!input || input.dataset.bound === "1") return;
      input.dataset.bound = "1";
      input.addEventListener('input', applySidebarSearch);
    }

    function refreshSidebarUI() {
      bindSidebarTabs();
      bindSidebarSearch();
      bindSidebarHoverActions();
      bindSidebarPinMuteOptimisticUI();
      bindSidebarChatActionsMenu();

      const tab = localStorage.getItem('sidebarTab') || 'chats';
      setSidebarTab(tab);

      highlightActiveChat();
      rememberLastChatUrl();

      updateMobileLayout();
    }

    function setupPresencePing() {
      if (document.body.dataset.presencePing === "1") return;
      const form = document.getElementById('presence-ping-form');
      if (!form) return;
      document.body.dataset.presencePing = "1";

      const send = () => {
        if (!window.htmx || typeof window.htmx.trigger !== 'function') return;
        window.htmx.trigger(form, 'submit');
      };

      // send();
      window.setInterval(send, 30000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) send();
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      refreshSidebarUI();
      setupPresencePing();
    });
    document.body.addEventListener('htmx:afterSwap', refreshSidebarUI);
    document.body.addEventListener('htmx:afterSettle', refreshSidebarUI);
    document.body.addEventListener('htmx:wsAfterMessage', refreshSidebarUI);
    document.addEventListener(
      'htmx:wsBeforeMessage',
      (e) => {
        if (!window._rtchatNavToken) return;
        if (e && typeof e.preventDefault === 'function') e.preventDefault();
        if (e && typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
        else if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
      },
      { capture: true }
    );
    document.addEventListener(
      'htmx:oobErrorNoTarget',
      (e) => {
        if (!window._rtchatNavToken) return;
        if (e && typeof e.preventDefault === 'function') e.preventDefault();
        if (e && typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
        else if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
      },
      { capture: true }
    );
    window.addEventListener('popstate', refreshSidebarUI);
    window.addEventListener('resize', refreshSidebarUI);

    function updateMobileLayout() {
      const sidebar = document.getElementById('tg-sidebar');
      const main = document.getElementById('tg-main');
      if (!sidebar || !main) return;
      const backBtn = document.getElementById('tg-back-btn');

      const isMobile = window.matchMedia('(max-width: 767px)').matches;
      if (!isMobile) {
        sidebar.classList.remove('hidden');
        main.classList.remove('hidden');
        if (backBtn) backBtn.classList.add('hidden');
        return;
      }

      const path = window.location.pathname || '';
      const inChat = path.startsWith('/chat/room/');

      if (inChat) {
        sidebar.classList.add('hidden');
        main.classList.remove('hidden');
        if (backBtn) backBtn.classList.remove('hidden');
      } else {
        sidebar.classList.remove('hidden');
        main.classList.add('hidden');
        if (backBtn) backBtn.classList.add('hidden');
      }
    }

    function setTelegramNavDir(dir) {
      try {
        sessionStorage.setItem('tgNavDir', dir);
      } catch (e) {
      }
    }

    function clearTelegramNavDir() {
      try {
        sessionStorage.removeItem('tgNavDir');
      } catch (e) {
      }
      document.documentElement.classList.remove('tg-nav-forward', 'tg-nav-back', 'tg-leave-forward', 'tg-leave-back');
      delete document.documentElement.dataset.tgNavLock;
    }

    function _refreshSidebar() {
      var presenceForm = document.getElementById('presence-ping-form');
      if (presenceForm && window.htmx && typeof window.htmx.trigger === 'function') {
        try { window.htmx.trigger(presenceForm, 'submit'); } catch (e) {}
      }

      var sidebarContent = document.getElementById('sidebar-content');
      if (sidebarContent && !sidebarContent.innerHTML.trim()) {
        window.setTimeout(function () {
          var sc = document.getElementById('sidebar-content');
          if (sc && !sc.innerHTML.trim()) {
            var pf = document.getElementById('presence-ping-form');
            if (pf && window.htmx && typeof window.htmx.trigger === 'function') {
              try { window.htmx.trigger(pf, 'submit'); } catch (e) {}
            }
          }
        }, 500);
      }
    }

    function telegramBack() {
      setTelegramNavDir('back');
      var isMobile = window.matchMedia('(max-width: 767px)').matches;

      if (isMobile) {
        if (document.documentElement.dataset.tgNavLock === '1') return;
        document.documentElement.dataset.tgNavLock = '1';
        document.documentElement.classList.add('tg-leave-back');

        window.setTimeout(function () {
          if (typeof window.RtChat !== 'undefined' && window.RtChat.cleanup) window.RtChat.cleanup();

    var _chatSkeletonHtml = [

    function navigateToChat(href, opts) {
      if (!href) return;
      var options = opts || {};
      var doPush = options.push !== false;

      if (typeof window.RtChat !== 'undefined' && window.RtChat.cleanup) window.RtChat.cleanup();

      var content = document.getElementById('tg-chat-content');
      if (content) content.innerHTML = _chatSkeletonHtml;

      if (doPush) {
        try { history.pushState({}, '', href); } catch (e) {}
        doPush = false;
      }

      updateMobileLayout();

      if (!window.htmx || typeof window.htmx.ajax !== 'function') {
        window.location.href = href;
        return;
      }

      var myNavToken = Date.now().toString(36) + Math.random().toString(36).slice(2);
      window._rtchatNavToken = myNavToken;
      setTimeout(function () {
        if (window._rtchatNavToken !== myNavToken) return;
        var root = document.getElementById('chat_root');
        if (!root) window.location.href = href;
      }, 6000);

      var ajaxPromise;
      try {
        ajaxPromise = window.htmx.ajax('GET', href, {
          target: '#tg-chat-content',
          swap: 'innerHTML settle:0s',
          headers: { 'X-Chat-Nav': '1' },
        });
      } catch (e) {
        window.location.href = href;
        return;
      }

      var afterSwap = function () {
        if (window._rtchatNavToken === myNavToken) delete window._rtchatNavToken;
        highlightActiveChat();
        clearTelegramNavDir();
        updateMobileLayout();

        if (typeof window.RtChat !== 'undefined' && window.RtChat.init) window.RtChat.init();

        if (href.indexOf('/chat/room/') !== -1) {
          try { localStorage.setItem('lastChatUrl', href); } catch (e) {}
        }
      };

      if (ajaxPromise && typeof ajaxPromise.then === 'function') {
        ajaxPromise.then(afterSwap).catch(function () {
          window.location.href = href;
        });
      } else {
        var settled = false;
        var onSettle = function (e) {
          if (settled) return;
          var t = e && e.detail && e.detail.target;
          if (t && t.id === 'tg-chat-content') {
            settled = true;
            document.body.removeEventListener('htmx:afterSettle', onSettle);
            afterSwap();
          }
        };
        document.body.addEventListener('htmx:afterSettle', onSettle);
        setTimeout(function () {
          if (settled) return;
          settled = true;
          document.body.removeEventListener('htmx:afterSettle', onSettle);
        }, 15000);
      }
    }

    document.addEventListener(
      'click',
      (e) => {
        const a = e.target && e.target.closest ? e.target.closest('#chats-list a.chat-item') : null;
        if (!a) return;
        if (e.defaultPrevented) return;
        if (e.button !== 0) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        const href = (a.getAttribute('href') || '').toString();
        if (!href) return;

        e.preventDefault();
        var isMobile = window.matchMedia('(max-width: 767px)').matches;
        setTelegramNavDir('forward');

        if (isMobile) {

          document.documentElement.dataset.tgNavLock = '1';
          document.documentElement.classList.add('tg-leave-forward');
          window.setTimeout(function () {
            navigateToChat(href, { push: true });
          }, 140);
        } else {
          navigateToChat(href, { push: true });
        }
      },
      { capture: true }
    );

    window.addEventListener('popstate', function () {
      var path = window.location.pathname || '';
      if (path.indexOf('/chat/room/') === 0) {
        navigateToChat(path, { push: false });
      } else {
        if (typeof window.RtChat !== 'undefined' && window.RtChat.cleanup) window.RtChat.cleanup();
        var content = document.getElementById('tg-chat-content');
        if (content) content.innerHTML = '';
        updateMobileLayout();
        highlightActiveChat();
      }
    });

    window.addEventListener('pageshow', () => {
      window.setTimeout(clearTelegramNavDir, 650);
    });

    function rememberLastChatUrl() {
      const path = window.location.pathname || '';
      if (path.startsWith('/chat/room/')) localStorage.setItem('lastChatUrl', path);
    }

    function goToLastChatOrHome(e) {
      const lastChatUrl = localStorage.getItem('lastChatUrl') || '';
      if (e) e.preventDefault();
      const home = '/';
      const target = lastChatUrl.startsWith('/chat/room/') ? lastChatUrl : home;

      if (target === home) {
        window.location.href = home;
        return false;
      }

      fetch(target, { method: 'GET', credentials: 'same-origin', redirect: 'follow' })
        .then((res) => {
          if (!res || !res.ok) {
            localStorage.removeItem('lastChatUrl');
            window.location.href = home;
            return;
          }
          try {
            const u = new URL(res.url || home, window.location.origin);
            window.location.href = `${u.pathname}${u.search}${u.hash}`;
          } catch (err) {
            window.location.href = home;
          }
        })
        .catch(() => {
          localStorage.removeItem('lastChatUrl');
          window.location.href = home;
        });
      return false;
    }
  </script>

  <script>
    (function () {
      const modal = document.getElementById('img-modal');
      const modalImg = document.getElementById('img-modal-src');
      const closeBtn = document.getElementById('img-modal-close');
      const saveBtn = document.getElementById('img-modal-save');
      const MIN_SCALE = 1;
      const MAX_SCALE = 4;
      let scale = 1;
      let translateX = 0;
      let translateY = 0;
      let panStartX = 0;
      let panStartY = 0;
      let panOriginX = 0;
      let panOriginY = 0;
      let pinchStartDistance = 0;
      let pinchStartScale = 1;
      let pinchStartMidX = 0;
      let pinchStartMidY = 0;
      let currentSrc = "";

      function clamp(n, min, max) {
        return Math.max(min, Math.min(max, n));
      }

      function distance(t1, t2) {
        const dx = t2.clientX - t1.clientX;
        const dy = t2.clientY - t1.clientY;
        return Math.hypot(dx, dy);
      }

      function midpoint(t1, t2) {
        return {
          x: (t1.clientX + t2.clientX) / 2,
          y: (t1.clientY + t2.clientY) / 2,
        };
      }

      function applyTransform() {
        if (!modalImg) return;
        modalImg.style.transform = `translate3d(${translateX}px, ${translateY}px, 0) scale(${scale})`;
      }

      function resetTransform() {
        scale = 1;
        translateX = 0;
        translateY = 0;
        if (!modalImg) return;
        modalImg.style.transformOrigin = 'center center';
        modalImg.style.touchAction = 'none';
        applyTransform();
      }

      function inferFilenameFromUrl(url) {
        try {
          const u = new URL(url, window.location.href);
          const raw = (u.pathname || '').split('/').pop() || '';
          const decoded = raw ? decodeURIComponent(raw) : '';
          const name = (decoded || raw || 'image').trim();
          return name || 'image';
        } catch (e) {
          return 'image';
        }
      }

      function ensureExtension(filename, contentType) {
        const hasExt = /\.[a-z0-9]{2,5}$/i.test(filename || '');
        if (hasExt) return filename;
        const ct = String(contentType || '').toLowerCase();
        const map = {
          'image/jpeg': 'jpg',
          'image/jpg': 'jpg',
          'image/png': 'png',
          'image/webp': 'webp',
          'image/gif': 'gif',
          'image/heic': 'heic',
          'image/heif': 'heif',
          'image/avif': 'avif',
        };
        const ext = map[ct] || 'jpg';
        return `${filename}.${ext}`;
      }

      function isIOS() {
        try {
          const ua = String((navigator && navigator.userAgent) || "").toLowerCase();
          return /iphone|ipad|ipod/.test(ua);
        } catch (e) {
          return false;
        }
      }

      async function saveImage(url) {
        const src = (url || '').toString().trim();
        if (!src) return;

        let absUrl = '';
        try {
          absUrl = new URL(src, window.location.href).toString();
        } catch (e) {
          absUrl = src;
        }

        try {
          const u = new URL(absUrl, window.location.href);
          const isSameOrigin = u.origin === window.location.origin;
          const res = await fetch(u.toString(), { credentials: isSameOrigin ? 'same-origin' : 'omit' });
          if (!res || !res.ok) throw new Error('fetch_failed');

          const blob = await res.blob();
          const contentType = blob.type || res.headers.get('content-type') || '';

          let filename = inferFilenameFromUrl(u.toString());
          filename = ensureExtension(filename, contentType);

          const file = new File([blob], filename, { type: contentType || 'application/octet-stream' });

          const canShareFiles =
            typeof navigator !== 'undefined' &&
            typeof navigator.share === 'function' &&
            typeof navigator.canShare === 'function' &&
            navigator.canShare({ files: [file] });

          if (canShareFiles && isIOS()) {
            await navigator.share({ files: [file], title: filename });
            return;
          }

          try {
            const objectUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = objectUrl;
            a.download = filename;
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.setTimeout(() => URL.revokeObjectURL(objectUrl), 1500);
            return;
          } catch (e) {
          }

          if (canShareFiles) {
            await navigator.share({ files: [file], title: filename });
            return;
          }
        } catch (e) {
          try {
            window.open(absUrl, '_blank', 'noopener,noreferrer');
            return;
          } catch (err) {
          }
          try {
            window.location.href = absUrl;
          } catch (err) {
          }
          try {
            window.alert("ذخیره تصویر ناموفق بود. دوباره تلاش کنید.");
          } catch (err) {
          }
        }
      }

      function openModal(src) {
        modalImg.src = src;
        currentSrc = src || "";
        resetTransform();
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        modalImg.src = '';
        currentSrc = "";
        resetTransform();
        document.body.style.overflow = '';
      }

      if (closeBtn) closeBtn.addEventListener('click', closeModal);
      if (saveBtn) {
        saveBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          saveImage(currentSrc || (modalImg ? modalImg.src : ""));
        });
      }

      if (modalImg) {
        modalImg.addEventListener('touchstart', (e) => {
          if (modal.classList.contains('hidden')) return;
          if (!e.touches || e.touches.length === 0) return;

          if (e.touches.length === 2) {
            e.preventDefault();
            pinchStartDistance = distance(e.touches[0], e.touches[1]) || 1;
            pinchStartScale = scale;
            const mid = midpoint(e.touches[0], e.touches[1]);
            pinchStartMidX = mid.x;
            pinchStartMidY = mid.y;
            panOriginX = translateX;
            panOriginY = translateY;
            return;
          }

          if (e.touches.length === 1 && scale > 1) {
            e.preventDefault();
            panStartX = e.touches[0].clientX;
            panStartY = e.touches[0].clientY;
            panOriginX = translateX;
            panOriginY = translateY;
          }
        }, { passive: false });

        modalImg.addEventListener('touchmove', (e) => {
          if (modal.classList.contains('hidden')) return;
          if (!e.touches || e.touches.length === 0) return;

          if (e.touches.length === 2) {
            e.preventDefault();
            const d = distance(e.touches[0], e.touches[1]) || 1;
            const nextScale = clamp((pinchStartScale * d) / pinchStartDistance, MIN_SCALE, MAX_SCALE);

            const mid = midpoint(e.touches[0], e.touches[1]);
            const dx = mid.x - pinchStartMidX;
            const dy = mid.y - pinchStartMidY;

            scale = nextScale;
            translateX = panOriginX + dx;
            translateY = panOriginY + dy;
            applyTransform();
            return;
          }

          if (e.touches.length === 1 && scale > 1) {
            e.preventDefault();
            const dx = e.touches[0].clientX - panStartX;
            const dy = e.touches[0].clientY - panStartY;
            translateX = panOriginX + dx;
            translateY = panOriginY + dy;
            applyTransform();
          }
        }, { passive: false });

        modalImg.addEventListener('touchend', () => {
          if (scale <= 1) resetTransform();
        });
      }

      document.addEventListener('click', (e) => {
        const img = e.target.closest('img[data-zoom-src]');
        if (!img) return;
        openModal(img.dataset.zoomSrc);
      });

      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
      });
    })();
  </script>

  <script>
    (function () {
      try {
        if (window.__rtchatNotifInit === true) return;
        window.__rtchatNotifInit = true;
      } catch (e) {
      }
      const SNAPSHOT_KEY = "rtchatUnreadSnapshotV1";
      let lastSnapshot = null;
      let swRegistration = null;
      let hasPushSubscription = false;

      function getCsrfToken() {
        const name = "csrftoken=";
        const parts = (document.cookie || "").split(";");
        for (const raw of parts) {
          const c = raw.trim();
          if (c.startsWith(name)) return decodeURIComponent(c.slice(name.length));
        }
        return "";
      }

      function toInt(v) {
        const n = parseInt(String(v || "").trim(), 10);
        return Number.isFinite(n) ? n : 0;
      }

      function readSnapshotFromDom() {
        const map = {};
        const items = document.querySelectorAll("a.chat-item[data-chat-id]");
        items.forEach((a) => {
          const id = (a.getAttribute("data-chat-id") || "").trim();
          if (!id) return;
          map[id] = {
            url: (a.getAttribute("data-chat-url") || "").trim(),
            title: (a.getAttribute("data-chat-title") || "").trim(),
            lastText: (a.getAttribute("data-chat-last-text") || "").trim(),
            unread: toInt(a.getAttribute("data-chat-unread")),
            muted: a.getAttribute("data-chat-muted") === "1",
          };
        });
        return map;
      }

      function loadSnapshot() {
        try {
          const raw = localStorage.getItem(SNAPSHOT_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return null;
          return parsed;
        } catch (e) {
          return null;
        }
      }

      function mergeSnapshots(baseSnapshot, nextSnapshot) {
        const merged = {};
        try {
          Object.assign(merged, baseSnapshot || {});
          Object.assign(merged, nextSnapshot || {});
          return merged;
        } catch (e) {
          return nextSnapshot || baseSnapshot || {};
        }
      }

      function saveSnapshot(snapshot) {
        try {
          const current = loadSnapshot() || {};
          const merged = mergeSnapshots(current, snapshot || {});
          localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(merged));
        } catch (e) {
          return;
        }
      }

      function canNotify() {
        return typeof Notification !== "undefined" && Notification.permission === "granted";
      }

      function showChatNotification(chat) {
        if (!canNotify()) return;
        if (!chat || chat.muted) return;
        if (hasPushSubscription) return;

        const normalizePath = (p) => {
          const s = (p || "").toString().trim().replace(/\/+$/, "");
          return s || "/";
        };
        if (chat.url && normalizePath(window.location.pathname || "") === normalizePath(chat.url)) return;

        const title = chat.title || "پیام جدید";
        const body = chat.lastText || "";
        const url = chat.url || "/";
        const options = {
          body,
          icon: "/static/logo.png",
          badge: "/static/logo.png",
          tag: `rtchat:${url}`,
          renotify: false,
          data: { url },
        };

        if (swRegistration && swRegistration.showNotification) {
          swRegistration.showNotification(title, options);
          return;
        }
        try {
          const n = new Notification(title, options);
          n.onclick = () => {
            window.focus();
            window.location.href = url;
            n.close();
          };
        } catch (e) {
          return;
        }
      }

      function metaContent(name) {
        const el = document.querySelector(`meta[name="${name}"]`);
        return (el && (el.getAttribute("content") || "").trim()) || "";
      }

      const APP_VERSION = metaContent("app-version") || "dev";
      const RESET_REQUIRED_DEFAULT = metaContent("app-reset-required") === "1";
      const RESET_MESSAGE_DEFAULT = metaContent("app-reset-message") || "";
      const IGNORE_NAVIGATOR_ONLINE = metaContent("ignore-navigator-online") === "1";
      const APP_VERSION_KEY = "pwaAppVersion";

      // ورژن صفحه‌ای که الان لود شده رو در sessionStorage ذخیره کن
      // این قبل از register SW انجام میشه — بعد از controllerchange ازش استفاده میکنیم
      const PAGE_VERSION_AT_LOAD_KEY = "pwaPageVersionAtLoad";
      try { sessionStorage.setItem(PAGE_VERSION_AT_LOAD_KEY, APP_VERSION); } catch(e) {}

      (function () {
        try {
          const prev = localStorage.getItem(APP_VERSION_KEY) || "";
          if (prev && prev !== APP_VERSION) {
            sessionStorage.setItem("pwaVersionChanged", "1");
            if (RESET_REQUIRED_DEFAULT) sessionStorage.setItem("pwaCleanupPending", "1");
          } else {
            sessionStorage.removeItem("pwaVersionChanged");
          }
          localStorage.setItem(APP_VERSION_KEY, APP_VERSION);
        } catch (e) {
        }
      })();

      function rtchatIsOnline() {
        if (IGNORE_NAVIGATOR_ONLINE) return true;
        return typeof navigator === "undefined" ? true : navigator.onLine !== false;
      }

      window.rtchatIsOnline = rtchatIsOnline;

      let pwaUpdateReg = null;
      let pwaWaitingWorker = null;
      let pwaPreparedOk = false;
      let pwaPrepareFailed = [];
      let pwaPreparing = false;
      let pwaChecking = false;
      let pwaFlowRunning = false;
      let pwaStatusText = "";
      let pwaStatusKind = "info";
      let pwaPrepareResolver = null;
      let pwaInstallPrompt = null;

      function isAuthenticated() {
        try {
          return document.body && document.body.dataset && document.body.dataset.authenticated === "1";
        } catch (e) {
          return false;
        }
      }

      function isAccountRoute() {
        const p = (window.location && window.location.pathname) ? String(window.location.pathname) : "";
        return p === "/accounts" || p.startsWith("/accounts/");
      }

      function canShowPwaUpdateModal() {
        const result = isAuthenticated() && !isAccountRoute();
        return result;
      }

      function markPwaUpdatePending() {
        try {
          sessionStorage.setItem("pwaUpdatePending", "1");
        } catch (e) {
        }
      }

      function clearPwaUpdatePending() {
        try {
          sessionStorage.removeItem("pwaUpdatePending");
        } catch (e) {
        }
      }

      function isStandaloneDisplay() {
        try {
          if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
        } catch (e) {
        }
        try {
          if (window.navigator && window.navigator.standalone) return true;
        } catch (e) {
        }
        return false;
      }

      function isIOS() {
        const ua = String((navigator && navigator.userAgent) || "").toLowerCase();
        return /iphone|ipad|ipod/.test(ua);
      }

      function isIOSStandaloneCapable() {
        if (!isIOS()) return false;
        try {
          return typeof window.navigator.standalone !== "undefined";
        } catch (e) {
          return false;
        }
      }

        modal.innerHTML = `

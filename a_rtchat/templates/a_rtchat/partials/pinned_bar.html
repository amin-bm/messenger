<div id="pinned_bar"{% if pinned_oob %} hx-swap-oob="outerHTML"{% endif %} class="{% if not pinned_messages %}hidden {% endif %}shrink-0 border-b border-slate-200/70 bg-white/70 px-3 py-1.5 backdrop-blur-xl dark:border-white/10 dark:bg-slate-950/40">
  <div class="flex items-center gap-2">
    <span class="shrink-0 text-blue-500 dark:text-sky-400" aria-hidden="true">📌</span>
    <div class="min-w-0 flex-1 space-y-0.5">
      {% for m in pinned_messages %}
        <div class="flex items-center gap-2 rounded-lg px-2 py-0.5 hover:bg-black/5 dark:hover:bg-white/10">
          <button type="button" data-pin-jump-id="{{ m.id }}" data-pin-id="{{ m.id }}" class="flex min-w-0 flex-1 items-center gap-2 overflow-hidden text-right">
            <span class="shrink-0 max-w-[38%] truncate text-[11px] font-semibold text-blue-700 dark:text-sky-300">{{ m.author.profile.name|default:m.author.username }}</span>
            <span class="min-w-0 flex-1 truncate text-xs text-gray-600 dark:text-slate-300" dir="auto" style="unicode-bidi: plaintext; text-align: start;">{{ m.pin_preview }}</span>
          </button>
          {% if can_pin_messages %}
            <button type="button" data-pin-unpin-id="{{ m.id }}" data-pin-url="{% url 'chat-message-pin' m.id %}" title="Unpin" class="shrink-0 rounded-lg p-1 text-gray-400 hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-500/10">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
            </button>
          {% endif %}
        </div>
      {% endfor %}
    </div>
    <span class="shrink-0 text-[11px] font-medium text-gray-400 dark:text-slate-500">{{ pinned_messages|length }}/3</span>
  </div>
</div>

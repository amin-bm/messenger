{% extends "base.html" %}
{% load static %}

{% block layout %}
<content class="block w-full">
  <!-- ارتفاع کل صفحه منهای هدر -->
  <div class="mx-auto max-w-6xl px-0 md:px-4 py-0 md:py-4">
    <div class="flex h-[100dvh] md:h-[calc(100dvh-2rem)] overflow-hidden md:rounded-2xl bg-white md:shadow-2xl">

      <!-- Sidebar (لیست چت‌ها) -->
      <aside id="tg-sidebar" class="{% if '/chat/room/' in request.path %}hidden md:flex{% else %}flex{% endif %} w-full md:w-[320px] shrink-0 border-b md:border-b-0 md:border-r bg-gray-50 flex-col">
        <!-- Header سایدبار -->
        <div class="flex items-center gap-3 border-b px-4 py-3">
        <nav class="block relative">
          <ul class="navitems flex bg-gray-300 rounded-xl items-center justify-center h-full">
            
              
              <li x-data="{ dropdownOpen: false }" class="relative">
                  <a @click="dropdownOpen = !dropdownOpen" @click.away="dropdownOpen = false" class="cursor-pointer select-none">
                      <img class="h-8 w-8 rounded-full object-cover" src="{{ request.user.profile.avatar }}" alt="Avatar" />
                      
                      <img x-bind:class="dropdownOpen && 'rotate-180 duration-300'" class="w-4" src="{% static 'images/expand-arrow.png' %}" alt="Dropdown" />
                  </a>
                  <div x-show="dropdownOpen" x-cloak
                    class="absolute left-0 top-full mt-2 bg-white text-black shadow rounded-lg w-40 p-2 z-20 text-left"
                    x-transition:enter="duration-300 ease-out"
                    x-transition:enter-start="opacity-0 -translate-y-5 scale-90"
                    x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                    >
                      <ul class="hoverlist [&>li>a]:justify-start [&>li>a]:text-left">
                          <li>
                            <a class="gap-2" href="{% url 'profile' %}">
                              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" class="shrink-0 text-gray-600">
                                <path d="M20 21a8 8 0 0 0-16 0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                              </svg>
                              <span>My Profile</span>
                            </a>
                          </li>
                          <li>
                            <a class="gap-2" href="{% url 'profile-edit' %}">
                              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" class="shrink-0 text-gray-600">
                                <path d="M4 20h4l10.5-10.5a2.828 2.828 0 1 0-4-4L4 16v4z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M13.5 6.5l4 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                              </svg>
                              <span>Edit Profile</span>
                            </a>
                          </li>
                          <li>
                            <a class="gap-2" href="{% url 'new-groupchat' %}">
                              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" class="shrink-0 text-gray-600">
                                <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8A8.5 8.5 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M12 9v6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M9 12h6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                              </svg>
                              <span>Create Chat</span>
                            </a>
                          </li>
                          <li>
                            <a class="gap-2" href="{% url 'profile-settings' %}">
                              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" class="shrink-0 text-gray-600">
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2.5"></circle>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                              </svg>
                              <span>Settings</span>
                            </a>
                          </li>
                          <li>
                            <a class="gap-2" href="{% url 'account_logout' %}">
                              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" class="shrink-0 text-gray-600">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M16 17l5-5-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M21 12H9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                              </svg>
                              <span>Log Out</span>
                            </a>
                          </li>
                      </ul>
                  </div>
              </li>
            </ul>
        </nav>

        <!-- Tabs container (WS will fill this) -->
        <div id="sidebar-tabs" class="ml-auto flex gap-2"></div>
        </div>

        <!-- اگر هنوز جای آنلاین داری -->
        <div id="online-user-count" class="hidden"></div>
        <div id="online-in-chats" class="relative"></div>


        <!-- Search (اختیاری) -->
        <div class="p-3">
          <input
            type="text"
            placeholder="Search"
            class="w-full rounded-xl bg-white px-4 py-2 text-sm border"
          />
        </div>

        <!-- لیست چت‌ها: همون آی‌دی قبلی برای سازگاری با کد شما -->
        <nav class="flex-1 overflow-y-auto px-2 pb-3">
            <div id="sidebar-content"></div>
        </nav>
      </aside>

      <!-- Main chat panel -->
      <main id="tg-main" class="{% if '/chat/room/' in request.path %}block{% else %}hidden md:block{% endif %} flex-1 bg-slate-100 min-w-0">
        <!-- اینجا محتوای صفحه چت فعلی شما میاد -->
        <div class="h-full">
          {% block content %}{% endblock %}
        </div>
      </main>

    </div>
  </div>
</content>
{% endblock %}
